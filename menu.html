<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>予約メニュー</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 30px;
    }

    #status {
      font-size: 18px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <h1>予約メニュー</h1>

  <div id="status">
    LIFFを起動しています…
  </div>

  <script>
    // =========================================
    // LIFF ID
    // =========================================

    const LIFF_ID = "2010574933-aX35Dagg";


    // =========================================
    // LIFF初期化
    // =========================================

    window.addEventListener("DOMContentLoaded", async () => {

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        // LINE未ログインの場合
        if (!liff.isLoggedIn()) {

          document.getElementById("status").textContent =
            "LINEログインを開始します…";

          liff.login({
            redirectUri: window.location.href
          });

          return;
        }


        // =========================================
        // LINEログイン済み
        // =========================================

        document.getElementById("status").textContent =
          "LIFFの起動に成功しました。";


        console.log("LIFF起動成功");
        console.log("LIFF ID:", LIFF_ID);
        console.log("LINEログイン済み");


      } catch (error) {

        console.error("LIFF初期化エラー:", error);

        document.getElementById("status").textContent =
          "LIFFの起動に失敗しました。";

      }

    });
  </script>

</body>
</html>
