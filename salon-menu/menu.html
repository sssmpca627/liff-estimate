<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>サロン予約メニュー</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
               "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 28px 16px 50px;
}

h1 {
  text-align: center;
  font-size: 32px;
  margin: 10px 0 12px;
  font-weight: 700;
}

.description {
  text-align: center;
  color: #777;
  font-size: 17px;
  margin-bottom: 30px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 28px 22px;
  margin-bottom: 24px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card h2 {
  margin: 0 0 8px;
  font-size: 28px;
}

.card p {
  margin: 0 0 22px;
  color: #777;
  font-size: 16px;
}

button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 18px 15px;
  font-size: 18px;
  font-weight: 700;
  background: #333;
  color: #fff;
  cursor: pointer;
}

button:active {
  opacity: 0.8;
}

.hidden {
  display: none;
}

.back-button {
  background: #eee;
  color: #333;
  margin-bottom: 20px;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 17px 5px;
  border-bottom: 1px solid #eee;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-item input {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.menu-name {
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

  <!-- メインメニュー -->
  <section id="mainMenu">

    <h1>サロン予約メニュー</h1>

    <div class="description">
      メニューを選択してください。
    </div>

    <!-- 全身脱毛 -->
    <div class="card">
      <h2>全身脱毛</h2>
      <p>全身脱毛のメニューを選択</p>

      <button onclick="showFullBody()">
        全身脱毛を選択
      </button>
    </div>

    <!-- セレクト脱毛 -->
    <div class="card">
      <h2>セレクト脱毛</h2>
      <p>気になる部位を自由に組み合わせ</p>

      <button onclick="selectMenu('セレクト脱毛')">
        セレクト脱毛を選択
      </button>
    </div>

    <!-- フェイシャル -->
    <div class="card">
      <h2>フェイシャル</h2>
      <p>フェイシャルコースを選択</p>

      <button onclick="selectMenu('フェイシャル')">
        フェイシャルを選択
      </button>
    </div>

  </section>


  <!-- 全身脱毛メニュー -->
  <section id="fullBodyMenu" class="hidden">

    <h1>全身脱毛</h1>

    <div class="description">
      ご希望のメニューをお選びください。
    </div>

    <button class="back-button" onclick="showMain()">
      ← メニュー一覧に戻る
    </button>

    <div class="card">

      <label class="menu-item">
        <input type="radio" name="fullbody" value="顔・VIOなし">
        <span class="menu-name">顔・VIOなし</span>
      </label>

      <label class="menu-item">
        <input type="radio" name="fullbody" value="顔 or VIO">
        <span class="menu-name">顔 or VIO</span>
      </label>

      <label class="menu-item">
        <input type="radio" name="fullbody" value="顔・VIO">
        <span class="menu-name">顔・VIO</span>
      </label>

    </div>

    <button onclick="confirmFullBody()">
      このメニューを選択
    </button>

  </section>


  <!-- ステータス -->
  <div id="status" style="text-align:center; margin-top:20px; color:#777;"></div>

</div>


<script>

const LIFF_ID = "2011037691-j7UfaGxQ";


/* =========================
   LIFF初期化
========================= */

window.addEventListener("DOMContentLoaded", async () => {

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    console.log("LIFF初期化成功");

    // LINEログインしていない場合
    if (!liff.isInClient() && !liff.isLoggedIn()) {

      document.getElementById("status").textContent =
        "LINEログインが必要です。";

      liff.login();

      return;
    }

    console.log("LINEログイン済み");

    document.getElementById("status").textContent = "";

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "LIFFの初期化に失敗しました。";

  }

});


/* =========================
   メインメニュー表示
========================= */

function showMain() {

  document.getElementById("mainMenu")
    .classList.remove("hidden");

  document.getElementById("fullBodyMenu")
    .classList.add("hidden");

}


/* =========================
   全身脱毛メニュー表示
========================= */

function showFullBody() {

  document.getElementById("mainMenu")
    .classList.add("hidden");

  document.getElementById("fullBodyMenu")
    .classList.remove("hidden");

}


/* =========================
   全身脱毛選択
========================= */

function confirmFullBody() {

  const selected =
    document.querySelector(
      'input[name="fullbody"]:checked'
    );

  if (!selected) {

    alert("メニューを選択してください。");

    return;
  }

    liff.sendMessages([
    {
      type: "text",
      text: "全身脱毛：" + selected.value
    }
  ]);

}


/* =========================
   その他メニュー
========================= */

function selectMenu(menuName) {

  alert(menuName + "を選択しました");

}

</script>

</body>
</html>
