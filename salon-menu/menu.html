<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>メニュー</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 35px 20px 60px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 30px 20px;
  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
  text-align: center;
}

h1 {
  font-size: 28px;
  margin: 0 0 25px;
}

.menu-name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 15px;
}

.message {
  color: #777;
  font-size: 17px;
  line-height: 1.7;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #888;
  font-size: 14px;
}

</style>

</head>


<body>


<div class="container">

  <div class="card">

    <h1 id="title">
      処理中…
    </h1>

    <div
      id="menuName"
      class="menu-name"
    ></div>

    <div
      id="message"
      class="message"
    ></div>

  </div>

  <div id="status"></div>

</div>


<script>


/* ==================================================
   LIFF設定
================================================== */

const LIFF_ID =
  "2011037691-j7UfaGxQ";


/* ==================================================
   カート
================================================== */

const CART_KEY =
  "salon_cart";


/* ==================================================
   メニュー情報
================================================== */

const MENUS = {

  face_all: {

    menu: "face_all",

    name: "顔全体",

    price: 5000,

    time: 30

  },

  face_upper: {

    menu: "face_upper",

    name: "上顔面",

    price: 3000,

    time: 30

  },

  face_lower: {

    menu: "face_lower",

    name: "下顔面",

    price: 3000,

    time: 30

  }

};


/* ==================================================
   URLから menu を取得
================================================== */

function getMenuId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("menu");

}


/* ==================================================
   カート取得
================================================== */

function getCart() {

  const saved =
    localStorage.getItem(
      CART_KEY
    );


  if (!saved) {

    return [];

  }


  try {

    const cart =
      JSON.parse(saved);


    if (!Array.isArray(cart)) {

      return [];

    }


    return cart;

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* ==================================================
   カート保存
================================================== */

function saveCart(cart) {

  localStorage.setItem(

    CART_KEY,

    JSON.stringify(cart)

  );

}


/* ==================================================
   カートへ追加
================================================== */

function addToCart(menu) {

  const cart =
    getCart();


  const exists =
    cart.some(

      item =>
        item.menu === menu.menu

    );


  if (!exists) {

    cart.push(menu);

    saveCart(cart);

  }

}


/* ==================================================
   LINEへメッセージ送信
================================================== */

async function sendMessage() {

  await liff.sendMessages([

    {

      type: "text",

      text:
        "カートに追加しました"

    }

  ]);

}


/* ==================================================
   LIFFを閉じる
================================================== */

function closeLIFF() {

  setTimeout(

    function() {

      if (
        liff.isInClient()
      ) {

        liff.closeWindow();

      }

    },

    500

  );

}


/* ==================================================
   エラー表示
================================================== */

function showError(message) {

  document.getElementById(
    "title"
  ).textContent =
    "エラー";

  document.getElementById(
    "menuName"
  ).textContent =
    "";

  document.getElementById(
    "message"
  ).textContent =
    "";

  document.getElementById(
    "status"
  ).textContent =
    message;

}


/* ==================================================
   メニュー追加処理
================================================== */

async function processMenu(menuId) {


  /* ------------------------------------------
     メニュー確認
  ------------------------------------------ */

  const menu =
    MENUS[menuId];


  if (!menu) {

    showError(
      "メニュー情報を取得できませんでした。"
    );

    return;

  }


  /* ------------------------------------------
     画面表示
  ------------------------------------------ */

  document.getElementById(
    "title"
  ).textContent =
    "カートに追加しました";


  document.getElementById(
    "menuName"
  ).textContent =
    menu.name;


  document.getElementById(
    "message"
  ).textContent =
    "このメニューをカートに追加しました。";


  try {


    /* ------------------------------------------
       ① カートへ保存
    ------------------------------------------ */

    addToCart(menu);


    /* ------------------------------------------
       ② LIFF初期化
    ------------------------------------------ */

    await liff.init({

      liffId:
        LIFF_ID

    });


    /* ------------------------------------------
       ③ LINEアプリ内確認
    ------------------------------------------ */

    if (
      !liff.isInClient()
    ) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    /* ------------------------------------------
       ④ メッセージ送信
    ------------------------------------------ */

    await sendMessage();


    console.log(
      "カート追加メッセージ送信成功"
    );


    /* ------------------------------------------
       ⑤ 自動終了
    ------------------------------------------ */

    closeLIFF();


  } catch (error) {


    console.error(
      "カート追加エラー",
      error
    );


    showError(
      "エラー：" +
      error.message
    );

  }

}


/* ==================================================
   カートを見る
================================================== */

function showCart() {

  /*
   * カートを見る場合だけ
   * cart.htmlではなく
   * menu.html?mode=cart
   * を使う
   */

  window.location.href =
    "https://liff.line.me/2011037691-j7UfaGxQ/?mode=cart";

}


/* ==================================================
   起動
================================================== */

async function main() {


  const menuId =
    getMenuId();


  /* ------------------------------------------
     menu がある場合
     → メニュー追加処理だけ実行
  ------------------------------------------ */

  if (menuId) {

    await processMenu(
      menuId
    );

    return;

  }


  /* ------------------------------------------
     menu がない場合
     → メニュー選択画面を表示するのではなく
     → エラーにする
  ------------------------------------------ */

  showError(
    "メニューが指定されていません。"
  );

}


window.addEventListener(

  "DOMContentLoaded",

  main

);

</script>


</body>

</html>
