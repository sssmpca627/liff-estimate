<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>メニュー・カート</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 35px 20px 60px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 30px 20px;
  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
}

h1 {
  text-align: center;
  font-size: 28px;
  margin: 0 0 10px;
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 16px;
  margin-bottom: 30px;
}

.cart-item {
  border: 1px solid #e3e3e3;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 12px;
}

.item-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.item-name {
  font-size: 20px;
  font-weight: 700;
}

.delete-button {
  border: none;
  background: transparent;
  color: #999;
  font-size: 15px;
}

.item-bottom {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
  color: #777;
}

.total {
  border-top: 1px solid #ddd;
  margin-top: 25px;
  padding-top: 22px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}

.total-label {
  color: #666;
}

.total-value {
  font-size: 22px;
  font-weight: 700;
}

.button {
  width: 100%;
  border-radius: 16px;
  padding: 17px;
  font-size: 18px;
  font-weight: 700;
  margin-top: 12px;
  cursor: pointer;
}

.add-button {
  background: #fff;
  border: 1px solid #ccc;
}

.complete-button {
  background: #333;
  border: 1px solid #333;
  color: #fff;
}

.clear-button {
  display: block;
  margin: 22px auto 0;
  border: none;
  background: transparent;
  color: #aaa;
  font-size: 15px;
}

#status {
  text-align: center;
  color: #888;
  font-size: 14px;
  margin-top: 20px;
}

.hidden {
  display: none;
}

</style>

</head>


<body>

<div class="container">

<div class="card">


<!-- =========================
     カート画面
========================= -->

<div id="cartScreen">

<h1>
選択したメニュー
</h1>

<div class="subtitle">
ご希望のメニューをご確認ください
</div>

<div id="cartList"></div>


<div class="total">

<div class="total-row">

<div class="total-label">
合計金額
</div>

<div
  id="totalPrice"
  class="total-value"
>
¥0
</div>

</div>


<div class="total-row">

<div class="total-label">
施術時間目安
</div>

<div
  id="totalTime"
  class="total-value"
>
0分
</div>

</div>

</div>


<button
  class="button add-button"
  onclick="goToMenu()"
>
メニュー追加
</button>


<button
  id="completeButton"
  class="button complete-button"
  onclick="completeSelection()"
>
選択完了
</button>


<button
  class="clear-button"
  onclick="clearCart()"
>
カートを空にする
</button>

</div>


</div>

<div id="status"></div>

</div>


<script>

/* =========================
   設定
========================= */

const LIFF_ID =
  "2011037691-j7UfaGxQ";

const CART_KEY =
  "salon_cart";


/* =========================
   カート取得
========================= */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);

  if (!saved) {
    return [];
  }

  try {

    const cart =
      JSON.parse(saved);

    return Array.isArray(cart)
      ? cart
      : [];

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* =========================
   カート保存
========================= */

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* =========================
   カート表示
========================= */

function renderCart() {

  const cart =
    getCart();

  const list =
    document.getElementById(
      "cartList"
    );


  if (
    cart.length === 0
  ) {

    list.innerHTML = `
      <div style="
        text-align:center;
        padding:35px 10px;
        color:#888;
      ">
        カートは空です
      </div>
    `;

    document.getElementById(
      "totalPrice"
    ).textContent =
      "¥0";

    document.getElementById(
      "totalTime"
    ).textContent =
      "0分";

    return;

  }


  list.innerHTML =
    cart.map(
      (item, index) => `

        <div class="cart-item">

          <div class="item-top">

            <div class="item-name">
              ${escapeHTML(
                item.name || "メニュー"
              )}
            </div>

            <button
              class="delete-button"
              onclick="removeItem(${index})"
            >
              削除
            </button>

          </div>

          <div class="item-bottom">

            <span>
              約${Number(item.time) || 0}分
            </span>

            <span>
              ¥${(
                Number(item.price) || 0
              ).toLocaleString("ja-JP")}
            </span>

          </div>

        </div>

      `
    ).join("");


  let totalPrice = 0;
  let totalTime = 0;


  cart.forEach(
    item => {

      totalPrice +=
        Number(item.price) || 0;

      totalTime +=
        Number(item.time) || 0;

    }
  );


  document.getElementById(
    "totalPrice"
  ).textContent =
    "¥" +
    totalPrice.toLocaleString("ja-JP");


  document.getElementById(
    "totalTime"
  ).textContent =
    totalTime +
    "分";

}


/* =========================
   削除
========================= */

function removeItem(index) {

  const cart =
    getCart();

  cart.splice(
    index,
    1
  );

  saveCart(cart);

  renderCart();

}


/* =========================
   カートを空にする
========================= */

function clearCart() {

  const cart =
    getCart();

  if (
    cart.length === 0
  ) {
    return;
  }


  if (
    !confirm(
      "カートを空にしますか？"
    )
  ) {
    return;
  }


  localStorage.removeItem(
    CART_KEY
  );

  renderCart();

}


/* =========================
   メニュー画面へ
========================= */

function goToMenu() {

  window.location.href =
    "https://liff.line.me/2011037691-j7UfaGxQ";

}


/* =========================
   選択完了
========================= */

async function completeSelection() {

  const cart =
    getCart();


  if (
    cart.length === 0
  ) {

    alert(
      "メニューを選択してください。"
    );

    return;

  }


  try {

    const button =
      document.getElementById(
        "completeButton"
      );

    button.disabled = true;

    button.textContent =
      "送信中…";


    await liff.init({

      liffId:
        LIFF_ID

    });


    if (
      !liff.isInClient()
    ) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    let totalPrice = 0;
    let totalTime = 0;


    let message =
      "【選択完了】\n\n";


    message +=
      "【選択したメニュー一覧】\n\n";


    cart.forEach(
      item => {

        const price =
          Number(item.price) || 0;

        const time =
          Number(item.time) || 0;

        message +=
          "✔ " +
          item.name +
          "　¥" +
          price.toLocaleString(
            "ja-JP"
          ) +
          "\n";

        totalPrice += price;

        totalTime += time;

      }
    );


    message +=
      "\n■ 合計金額\n¥" +
      totalPrice.toLocaleString(
        "ja-JP"
      );


    message +=
      "\n\n■ 施術時間目安\n" +
      totalTime +
      "分";


    await liff.sendMessages([

      {
        type: "text",
        text: message
      }

    ]);


    localStorage.removeItem(
      CART_KEY
    );


    setTimeout(
      function() {

        if (
          liff.isInClient()
        ) {

          liff.closeWindow();

        }

      },
      500
    );


  } catch (error) {

    console.error(
      "選択完了エラー",
      error
    );


    document.getElementById(
      "status"
    ).textContent =
      "エラー：" +
      error.message;


    const button =
      document.getElementById(
        "completeButton"
      );

    button.disabled = false;

    button.textContent =
      "選択完了";

  }

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   起動
========================= */

window.addEventListener(
  "DOMContentLoaded",
  function() {

    /*
     * 今回はカート画面として起動
     */

    renderCart();

  }
);

</script>

</body>

</html>
