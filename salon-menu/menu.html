<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 28px 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

h1 {
  text-align: center;
  font-size: 27px;
  margin: 0 0 10px;
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 15px;
  margin-bottom: 25px;
}

.menu-button {
  width: 100%;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 12px;
  text-align: left;
  cursor: pointer;
  font-size: inherit;
}

.menu-name {
  font-size: 20px;
  font-weight: 700;
}

.menu-detail {
  margin-top: 8px;
  color: #777;
  font-size: 15px;
}

.cart-item {
  border: 1px solid #e3e3e3;
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 12px;
}

.item-name {
  font-size: 19px;
  font-weight: 700;
}

.item-bottom {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  color: #777;
}

.delete-button {
  margin-top: 12px;
  border: none;
  background: transparent;
  color: #999;
  padding: 0;
  cursor: pointer;
}

.total {
  border-top: 1px solid #ddd;
  margin-top: 22px;
  padding-top: 20px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 13px;
}

.total-label {
  color: #666;
}

.total-value {
  font-size: 21px;
  font-weight: 700;
}

.button {
  width: 100%;
  border-radius: 16px;
  padding: 16px;
  font-size: 17px;
  font-weight: 700;
  margin-top: 12px;
  cursor: pointer;
}

.add-button {
  background: #fff;
  border: 1px solid #ccc;
}

.complete-button {
  background: #333;
  border: 1px solid #333;
  color: #fff;
}

.clear-button {
  display: block;
  margin: 20px auto 0;
  border: none;
  background: transparent;
  color: #aaa;
  cursor: pointer;
}

#status {
  text-align: center;
  color: #888;
  font-size: 14px;
  margin-top: 18px;
  white-space: pre-line;
}

.hidden {
  display: none;
}

</style>

</head>


<body>

<div class="container">

<div class="card">


<!-- =========================
     選択したメニュー画面
========================= -->

<div id="cartScreen">

<h1>
選択したメニュー
</h1>

<div class="subtitle">
ご希望のメニューをご確認ください
</div>

<div id="cartList"></div>


<div class="total">

<div class="total-row">

<div class="total-label">
合計金額
</div>

<div
  id="totalPrice"
  class="total-value"
>
¥0
</div>

</div>


<div class="total-row">

<div class="total-label">
施術時間目安
</div>

<div
  id="totalTime"
  class="total-value"
>
0分
</div>

</div>

</div>


<!-- メニュー追加 -->

<button
  type="button"
  class="button add-button"
  onclick="addMoreMenu()"
>
メニュー追加
</button>


<!-- 選択完了 -->

<button
  type="button"
  id="completeButton"
  class="button complete-button"
  onclick="completeSelection()"
>
選択完了
</button>


<button
  type="button"
  class="clear-button"
  onclick="clearCart()"
>
カートを空にする
</button>

</div>

</div>


<div id="status"></div>

</div>

};


/* ==================================================
   LIFF
================================================== */

let liffInitialized = false;

let liffInitializing = false;


async function initLIFF() {

  if (liffInitialized) {
    return;
  }

  if (liffInitializing) {

    while (liffInitializing) {

      await new Promise(
        resolve =>
          setTimeout(resolve, 50)
      );

    }

    return;

  }

  liffInitializing = true;

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    liffInitialized = true;

  } finally {

    liffInitializing = false;

  }

}


/* ==================================================
   カート取得
================================================== */

function getCart() {

  const saved =
    localStorage.getItem(
      CART_KEY
    );

  if (!saved) {
    return [];
  }

  try {

    const cart =
      JSON.parse(saved);

    return Array.isArray(cart)
      ? cart
      : [];

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* ==================================================
   カート保存
================================================== */

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* ==================================================
   メニュー追加
================================================== */

async function addMenu(menuId) {

  const menu =
    MENUS[menuId];


  if (!menu) {

    showError(
      "メニュー情報を取得できませんでした。\n" +
      "menu=" + menuId
    );

    return;

  }


  const cart =
    getCart();


  const alreadyAdded =
    cart.some(
      item =>
        item.menu === menuId
    );


  if (!alreadyAdded) {

    cart.push({
      menu: menu.menu,
      name: menu.name,
      price: menu.price,
      time: menu.time
    });

    saveCart(cart);

  }


  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    await liff.sendMessages([
      {
        type: "text",
        text: "カートに追加しました"
      }
    ]);


    setTimeout(
      function() {

        try {

          liff.closeWindow();

        } catch (error) {

          console.error(
            "LIFF終了エラー",
            error
          );

        }

      },
      500
    );


  } catch (error) {

    console.error(
      "カート追加エラー",
      error
    );

    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );

  }

}


/* ==================================================
   メニュー追加ボタン
================================================== */

async function addMoreMenu() {

  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    await liff.sendMessages([
      {
        type: "text",
        text: "メニュー追加"
      }
    ]);


    setTimeout(
      function() {

        try {

          liff.closeWindow();

        } catch (error) {

          console.error(
            "LIFF終了エラー",
            error
          );

        }

      },
      500
    );


  } catch (error) {

    console.error(
      "メニュー追加エラー",
      error
    );

    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );

  }

}


/* ==================================================
   カート表示
================================================== */

function renderCart() {

  const cart =
    getCart();


  const list =
    document.getElementById(
      "cartList"
    );


  if (cart.length === 0) {

    list.innerHTML =
      '<div style="text-align:center;padding:30px;color:#888;">カートは空です</div>';

    document.getElementById(
      "totalPrice"
    ).textContent =
      "¥0";

    document.getElementById(
      "totalTime"
    ).textContent =
      "0分";

    return;

  }


  list.innerHTML =
    cart.map(
      (item, index) => `

        <div class="cart-item">

          <div class="item-name">
            ${escapeHTML(
              item.name || "メニュー"
            )}
          </div>

          <div class="item-bottom">

            <span>
              約${Number(item.time) || 0}分
            </span>

            <span>
              ¥${(
                Number(item.price) || 0
              ).toLocaleString("ja-JP")}
            </span>

          </div>

          <button
            type="button"
            class="delete-button"
            onclick="removeItem(${index})"
          >
            削除
          </button>

        </div>

      `
    ).join("");


  let totalPrice = 0;

  let totalTime = 0;


  cart.forEach(
    item => {

      totalPrice +=
        Number(item.price) || 0;

      totalTime +=
        Number(item.time) || 0;

    }
  );


  document.getElementById(
    "totalPrice"
  ).textContent =
    "¥" +
    totalPrice.toLocaleString("ja-JP");


  document.getElementById(
    "totalTime"
  ).textContent =
    totalTime + "分";

}


/* ==================================================
   削除
================================================== */

function removeItem(index) {

  const cart =
    getCart();


  cart.splice(
    index,
    1
  );


  saveCart(cart);

  renderCart();

}


/* ==================================================
   カートを空にする
================================================== */

function clearCart() {

  if (
    getCart().length === 0
  ) {
    return;
  }


  if (
    !confirm(
      "カートを空にしますか？"
    )
  ) {

    return;

  }


  localStorage.removeItem(
    CART_KEY
  );


  renderCart();

}


/* ==================================================
   選択完了
================================================== */

async function completeSelection() {

  const cart =
    getCart();


  if (
    cart.length === 0
  ) {

    alert(
      "メニューを選択してください。"
    );

    return;

  }


  const button =
    document.getElementById(
      "completeButton"
    );


  button.disabled = true;

  button.textContent =
    "送信中…";


  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    let totalPrice = 0;

    let totalTime = 0;


    let message =
      "【選択したメニュー一覧】\n\n";


    cart.forEach(
      item => {

        const price =
          Number(item.price) || 0;

        const time =
          Number(item.time) || 0;


        message +=
          "✔ " +
          item.name +
          "　¥" +
          price.toLocaleString("ja-JP") +
          "｜約" +
          time +
          "分\n";


        totalPrice +=
          price;

        totalTime +=
          time;

      }
    );


    message +=
      "\n■ 合計金額\n¥" +
      totalPrice.toLocaleString("ja-JP");


    message +=
      "\n\n■ 施術時間目安\n" +
      totalTime +
      "分";


    message +=
      "\n\nこちらの内容でよろしいですか？";


    await liff.sendMessages([
      {
        type: "text",
        text: message
      }
    ]);


    localStorage.removeItem(
      CART_KEY
    );


    setTimeout(
      function() {

        try {

          liff.closeWindow();

        } catch (error) {

          console.error(
            "LIFF終了エラー",
            error
          );

        }

      },
      500
    );


  } catch (error) {

    console.error(
      "選択完了エラー",
      error
    );


    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );


    button.disabled = false;

    button.textContent =
      "選択完了";

  }

}


/* ==================================================
   エラー
================================================== */

function showError(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==================================================
   起動
================================================== */

async function startPage() {

  try {

    await initLIFF();


    const params =
      new URLSearchParams(
        window.location.search
      );


    /*
     * menu=指定
     *
     * 例：
     * ?menu=face_all
     */

    const menuId =
      params.get("menu");


    if (menuId) {

      await addMenu(menuId);

      return;

    }


    /*
     * カートを見る
     *
     * ?mode=cart
     */

    if (
      params.get("mode") === "cart"
    ) {

      renderCart();

      return;

    }


    /*
     * 通常時も
     * 選択したメニューだけ表示
     */

    renderCart();

  } catch (error) {

    console.error(
      "起動エラー",
      error
    );


    showError(
      "LIFFの起動に失敗しました。\n" +
      error.message
    );

  }

}


window.addEventListener(
  "DOMContentLoaded",
  startPage
);

</script>
