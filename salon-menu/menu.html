<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>サロン予約メニュー</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
               "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 28px 16px 50px;
}

h1 {
  text-align: center;
  font-size: 32px;
  margin: 10px 0 12px;
  font-weight: 700;
}

.description {
  text-align: center;
  color: #777;
  font-size: 17px;
  margin-bottom: 30px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 28px 22px;
  margin-bottom: 24px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card h2 {
  margin: 0 0 8px;
  font-size: 28px;
}

.card p {
  margin: 0 0 22px;
  color: #777;
  font-size: 16px;
}

button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 18px 15px;
  font-size: 18px;
  font-weight: 700;
  background: #333;
  color: #fff;
  cursor: pointer;
}

button:active {
  opacity: 0.8;
}

  .menu-select-button.selected {
  background: #666;
}

.menu-select-button.selected::before {
  content: "✓ ";
}

.hidden {
  display: none;
}

.back-button {
  background: #eee;
  color: #333;
  margin-bottom: 20px;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 17px 5px;
  border-bottom: 1px solid #eee;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-item input {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.menu-name {
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

  <!-- メインメニュー -->
  <section id="mainMenu">

    <h1>サロン予約メニュー</h1>

    <div class="description">
      メニューを選択してください。
    </div>

    <!-- 全身脱毛 -->
    <div class="card">
      <h2>全身脱毛</h2>
      <p>全身脱毛のメニューを選択</p>

      <button onclick="showFullBody()">
        全身脱毛を選択
      </button>
    </div>

    <!-- セレクト脱毛 -->
    <div class="card">
      <h2>セレクト脱毛</h2>
      <p>気になる部位を自由に組み合わせ</p>

      <button onclick="showSelectMenu()">
        セレクト脱毛を選択
      </button>
    </div>

    <!-- フェイシャル -->
    <div class="card">
      <h2>フェイシャル</h2>
      <p>フェイシャルコースを選択</p>

      <button onclick="selectMenu('フェイシャル')">
        フェイシャルを選択
      </button>
    </div>

  </section>
<!-- セレクト脱毛メニュー -->
<section id="selectMenu" class="hidden">

  <h1>セレクト脱毛</h1>

  <div class="description">
    ご希望の部位をお選びください。
  </div>

  <button class="back-button" onclick="showMain()">
    ← メニュー一覧に戻る
  </button>

  <div class="card">
<button id="faceCategoryButton" onclick="showFaceMenu()">
  顔・首まわり
</button>
    
    <br><br>

<button onclick="showUpperBodyMenu()">
    上半身
</button>

    <br><br>

<button onclick="showLowerBodyMenu()">
    下半身
</button>

    <br><br>

    <button onclick="showVioMenu()">
    VIO
</button>

  </div>

</section>



  <!-- 上半身メニュー -->
<section id="upperBodyMenu" class="hidden">

  <h1>上半身</h1>

  <div class="description">
    ご希望の部位をお選びください。
  </div>

  <button class="back-button" onclick="showSelectMenu()">
    ← セレクト脱毛に戻る
  </button>

  <div class="card">

    <button class="menu-select-button"
  onclick="selectUpperBodyMenu('乳輪周り', this)">
  乳輪周り
</button>

    <button class="menu-select-button"
  onclick="selectUpperBodyMenu('お腹全体', this)">
  お腹全体
</button>

    <button class="menu-select-button"
  onclick="selectUpperBodyMenu('背中全体', this)">
  背中全体
</button>
    
  </div>

  <div id="upperBodySelected"
       style="margin:20px 0; text-align:center; font-size:17px;">
  </div>

  <button onclick="confirmUpperBodyMenu()">
    選択完了
  </button>

</section>

  <!-- 下半身メニュー -->
<section id="lowerBodyMenu" class="hidden">

  <h1>下半身</h1>

  <div class="description">
    ご希望の部位をお選びください。
  </div>

  <button class="back-button" onclick="showSelectMenu()">
    ← セレクト脱毛に戻る
  </button>

  <div class="card">

<button class="menu-select-button"
  onclick="selectLowerBodyMenu('乳輪周り', this)">
  乳輪周り
</button>

<button class="menu-select-button"
  onclick="selectLowerBodyMenu('お腹全体', this)">
  お腹全体
</button>

<button class="menu-select-button"
  onclick="selectLowerBodyMenu('背中全体', this)">
  背中全体
</button>
    
  </div>

  <div id="lowerBodySelected"
       style="margin:20px 0; text-align:center; font-size:17px;">
  </div>

  <button onclick="confirmLowerBodyMenu()">
    選択完了
  </button>

</section>
  
  <!-- 顔・首まわりメニュー -->
  <section id="faceMenu" class="hidden">
    
  <h1>顔・首まわり</h1>

  <div class="description">
    ご希望の部位をお選びください。
  </div>

  <button class="back-button" onclick="showSelectMenu()">
    ← セレクト脱毛に戻る
  </button>

  <div class="card">

<button class="menu-select-button" onclick="selectFaceMenu('顔全体', this)">顔全体</button>
<button class="menu-select-button" onclick="selectFaceMenu('上顔面', this)">上顔面</button>
<button class="menu-select-button" onclick="selectFaceMenu('下顔面', this)">下顔面</button>
<button class="menu-select-button" onclick="selectFaceMenu('額', this)">額</button>
<button class="menu-select-button" onclick="selectFaceMenu('頬', this)">頬</button>
<button class="menu-select-button" onclick="selectFaceMenu('鼻', this)">鼻</button>
<button class="menu-select-button" onclick="selectFaceMenu('口まわり', this)">口まわり</button>
<button class="menu-select-button" onclick="selectFaceMenu('首まわり', this)">首まわり</button>

  </div>

  <div id="faceSelected"
       style="margin:20px 0; text-align:center; font-size:17px;">
  </div>

  <button onclick="confirmFaceMenu()">
    選択完了
  </button>

</section>

  <!-- 全身脱毛メニュー -->
  <section id="fullBodyMenu" class="hidden">

    <h1>全身脱毛</h1>

    <div class="description">
      ご希望のメニューをお選びください。
    </div>

    <button class="back-button" onclick="showMain()">
      ← メニュー一覧に戻る
    </button>

    <div class="card">

      <label class="menu-item">
        <input type="radio" name="fullbody" value="顔・VIOなし">
        <span class="menu-name">顔・VIOなし</span>
      </label>

      <label class="menu-item">
        <input type="radio" name="fullbody" value="顔 or VIO">
        <span class="menu-name">顔 or VIO</span>
      </label>

      <label class="menu-item">
        <input type="radio" name="fullbody" value="顔・VIO">
        <span class="menu-name">顔・VIO</span>
      </label>

    </div>

    <button onclick="confirmFullBody()">
      このメニューを選択
    </button>

  </section>

  <!-- カートを見る -->
<button onclick="showCart()">
  🛒 カートを見る
</button>
  
<!-- カート一覧 -->
<section id="cartMenu" class="hidden">

  <h1>選択したメニュー</h1>

  <div class="description">
    現在カートに入っているメニューです。
  </div>

  <div class="card">

    <div id="cartList"
         style="font-size:18px; line-height:2;">
    </div>

  </div>

  <button onclick="sendCartToLINE()">
    この内容で送信
  </button>

</section>
  <!-- ステータス -->
  <div id="status" style="text-align:center; margin-top:20px; color:#777;"></div>

</div>


<script>

const LIFF_ID = "2011037691-j7UfaGxQ";

// カート
let cart = JSON.parse(localStorage.getItem("cart") || "[]");

let selectedFaceMenus = [];
let selectedUpperBodyMenus = [];
let selectedLowerBodyMenus = [];

// URLからメニューを受け取る
async function receiveMenuFromURL() {

  const params = new URLSearchParams(window.location.search);
const menuCode = params.get("menu");

if (!menuCode) return;

const menuMap = {
  face_all: "顔全体",
  upper_face: "上顔面"
};

const menu = menuMap[menuCode];

if (!menu) return;

  // すでに入っているメニューは重複追加しない
  if (!cart.includes(menu)) {
    cart.push(menu);
    localStorage.setItem("cart", JSON.stringify(cart));
  }

document.getElementById("mainMenu").style.display = "none";
  
const status = document.getElementById("status");

status.textContent = "✓ 追加しました";

status.style.display = "block";
status.style.fontSize = "28px";
status.style.fontWeight = "700";
status.style.marginTop = "200px";
status.style.textAlign = "center";
  console.log("カートに追加：", menu);
  console.log("現在のカート：", cart);

// LIFFを閉じてLステップへ戻る
console.log("閉じる処理まで来ました");
  


/* =========================
   LIFF初期化
========================= */

window.addEventListener("DOMContentLoaded", async () => {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


console.log("LIFF初期化成功");
    
    console.log("LIFF初期化成功");

    // LINEログインしていない場合
    if (!liff.isInClient() && !liff.isLoggedIn()) {

      document.getElementById("status").textContent =
        "LINEログインが必要です。";

      liff.login();

      return;
    }

    console.log("LINEログイン済み");

    await receiveMenuFromURL();

    document.getElementById("status").textContent = "";

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "LIFFの初期化に失敗しました。";

  }

});

/* =========================
   カート表示
========================= */

function showCart() {

  document.getElementById("mainMenu")
    .classList.add("hidden");

  document.getElementById("fullBodyMenu")
    .classList.add("hidden");

  document.getElementById("selectMenu")
    .classList.add("hidden");

  document.getElementById("faceMenu")
    .classList.add("hidden");

  document.getElementById("upperBodyMenu")
    .classList.add("hidden");

  document.getElementById("cartMenu")
    .classList.remove("hidden");

  document.getElementById("cartList").innerText =
    cart.length > 0
      ? cart.join("\n")
      : "カートは空です。";
}

/* =========================
   メインメニュー表示
========================= */

function showMain() {

    document.getElementById("mainMenu")
        .classList.remove("hidden");

    document.getElementById("fullBodyMenu")
        .classList.add("hidden");

    document.getElementById("selectMenu")
        .classList.add("hidden");

    document.getElementById("faceMenu")
    .classList.add("hidden");

  document.getElementById("upperBodyMenu")
  .classList.add("hidden");
  
}





/* =========================
   全身脱毛メニュー表示
========================= */

function showFullBody() {

  document.getElementById("mainMenu")
    .classList.add("hidden");

  document.getElementById("fullBodyMenu")
    .classList.remove("hidden");

}


/* =========================
   全身脱毛選択
========================= */

async function confirmFullBody() {

  const selected =
    document.querySelector(
      'input[name="fullbody"]:checked'
    );

  if (!selected) {

    

    return;
  }

try {
  await liff.sendMessages([
    {
      type: "text",
      text: "全身脱毛：" + selected.value
    }
  ]);

  document.getElementById("status").textContent =
    "LINEへ送信しました。";

} catch (error) {
  console.error(error);

  document.getElementById("status").textContent =
    "送信に失敗しました：" + error.message;
}

}


/* =========================
   その他メニュー
========================= */

function selectMenu(menuName) {
  alert(menuName + "を選択しました");
}

function showUpperBodyMenu() {

  document.getElementById("mainMenu")
    .classList.add("hidden");

  document.getElementById("fullBodyMenu")
    .classList.add("hidden");

  document.getElementById("selectMenu")
    .classList.add("hidden");

  document.getElementById("faceMenu")
    .classList.add("hidden");

  document.getElementById("upperBodyMenu")
  .classList.remove("hidden");

}
/* =========================
   顔・首まわりメニュー表示
========================= */

function showSelectMenu() {

  document.getElementById("mainMenu")
    .classList.add("hidden");

  document.getElementById("fullBodyMenu")
    .classList.add("hidden");

  document.getElementById("faceMenu")
    .classList.add("hidden");

  document.getElementById("upperBodyMenu")
  .classList.add("hidden");
  
  document.getElementById("selectMenu")
    .classList.remove("hidden");

}

function showFaceMenu() {

  document.getElementById("selectMenu")
    .classList.add("hidden");

  document.getElementById("faceMenu")
    .classList.remove("hidden");
  

}

function selectFaceMenu(menuName, button) {

  // すでに選択されている場合は選択解除
  if (selectedFaceMenus.includes(menuName)) {

    selectedFaceMenus = selectedFaceMenus.filter(
      item => item !== menuName
    );

    button.classList.remove("selected");

  } else {

    // 選択されていなければ追加
    selectedFaceMenus.push(menuName);

    button.classList.add("selected");
  }

  // 選択中メニューを表示
  const selectedArea =
    document.getElementById("faceSelected");

  if (selectedFaceMenus.length === 0) {

    selectedArea.innerText =
      "まだメニューが選択されていません。";

  } else {

    selectedArea.innerText =
      "選択中：\n" +
      selectedFaceMenus.join("・");
  }

  console.log(
    "選択中のメニュー：",
    selectedFaceMenus
  );
    const faceButton =
    document.getElementById("faceCategoryButton");

  if (selectedFaceMenus.length > 0) {
    faceButton.innerText =
      "✓ 顔・首まわり（" +
      selectedFaceMenus.length +
      "）";
  } else {
    faceButton.innerText =
      "顔・首まわり";
  }
}


/* =========================
   顔・首まわり選択完了
========================= */

async function confirmFaceMenu() {

  if (selectedFaceMenus.length === 0) {

    document.getElementById("faceSelected").innerText =
      "メニューを1つ以上選択してください。";

    return;
  }

  try {

    await liff.sendMessages([
      {
        type: "text",
        text:
          "セレクト脱毛（顔・首まわり）：" +
          selectedFaceMenus.join("・")
      }
    ]);

    document.getElementById("faceSelected").innerText =
      "LINEへ送信しました。";

  } catch (error) {

    console.error(error);

    document.getElementById("faceSelected").innerText =
      "送信に失敗しました：" + error.message;

  }
}

</script>

</body>
</html>
