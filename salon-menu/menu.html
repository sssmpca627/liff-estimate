<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>カートに追加</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 50px 20px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 40px 25px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  text-align: center;
}

h1 {
  font-size: 28px;
  margin: 0 0 25px;
}

.menu-name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 15px;
}

.message {
  color: #777;
  font-size: 17px;
  line-height: 1.7;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #777;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>カートに追加</h1>

    <div id="menuName" class="menu-name">
      読み込み中...
    </div>

    <div class="message">
      カートに追加しています。
    </div>

  </div>

  <div id="status"></div>

</div>


<script>

/* =========================
   LIFF設定
========================= */

const LIFF_ID = "2011037691-j7UfaGxQ";


/* =========================
   カート
========================= */

let cart =
  JSON.parse(
    localStorage.getItem("cart") || "[]"
  );


/* =========================
   メニューコード → 表示名
========================= */

const menuNames = {

  /* 顔・首まわり */

  "face_all": "顔全体",
  "face_upper": "上顔面",
  "face_lower": "下顔面",
  "forehead": "額",
  "cheek": "頬",
  "nose": "鼻",
  "mouth": "口まわり",
  "neck": "首まわり",

  /* 上半身 */

  "upper_arms": "乳輪周り",
  "upper_stomach": "お腹全体",
  "upper_back": "背中全体",

  /* 必要に応じて今後追加 */
};


/* =========================
   URLからメニューを取得
========================= */

function getMenuFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const menuCode =
    params.get("menu");

  console.log(
    "受け取ったmenuコード：",
    menuCode
  );


  if (!menuCode) {

    return null;

  }


  /*
   * コードに対応する名前があれば
   * 日本語のメニュー名に変換
   *
   * なければURLの値をそのまま使用
   */

  const menuName =
    menuNames[menuCode] || menuCode;


  console.log(
    "メニュー名：",
    menuName
  );


  return menuName;

}


/* =========================
   画面表示
========================= */

function showMenuName(menuName) {

  document.getElementById(
    "menuName"
  ).textContent = menuName;

}


/* =========================
   カートに追加
========================= */

function addToCart(menuName) {

  cart.push(menuName);

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  console.log(
    "現在のカート：",
    cart
  );

}


/* =========================
   LINEへ自動送信
========================= */

async function sendCartAddedMessage(menuName) {

  await liff.sendMessages([
    {
      type: "text",

      text:
        "【カートに追加しました】\n" +
        menuName
    }
  ]);

}


/* =========================
   LIFFを閉じる
========================= */

function closeLIFF() {

  if (liff.isInClient()) {

    setTimeout(
      function() {

        liff.closeWindow();

      },
      500
    );

  }

}


/* =========================
   メイン処理
========================= */

async function main() {

  try {

    /*
     * URLからメニュー取得
     */

    getMenuFromURL();


    /*
     * menuがない場合
     */

    if (!menuName) {

      document.getElementById(
        "status"
      ).textContent =
        "メニュー情報を取得できませんでした。";

      return;

    }


    /*
     * 画面にメニュー名表示
     */

    showMenuName(menuName);


    /*
     * LIFF初期化
     */

    await liff.init({
      liffId: LIFF_ID
    });


    console.log(
      "LIFF初期化成功"
    );


    /*
     * LINEログイン確認
     */

    if (
      !liff.isInClient() &&
      !liff.isLoggedIn()
    ) {

      document.getElementById(
        "status"
      ).textContent =
        "LINEログインが必要です。";

      liff.login();

      return;

    }


    /*
     * カートに追加
     */

    addToCart(menuName);


    /*
     * LINEへ自動送信
     */

    await sendCartAddedMessage(
      menuName
    );


    /*
     * 完了表示
     */

    document.getElementById(
      "status"
    ).textContent =
      "カートに追加しました。";


    /*
     * LINE内なら自動で閉じる
     */

    closeLIFF();


  } catch (error) {

    console.error(
      "エラー：",
      error
    );


    document.getElementById(
      "status"
    ).textContent =
      "エラーが発生しました：" +
      error.message;

  }

}


/* =========================
   ページ読み込み時に実行
========================= */

window.addEventListener(
  "DOMContentLoaded",
  main
);

</script>

</body>
</html>
