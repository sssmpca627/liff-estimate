<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>カート</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 50px 20px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 35px 25px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  text-align: center;
}

.menu-name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 15px;
}

h1 {
  font-size: 28px;
  margin: 0 0 25px;
}

.message {
  color: #777;
  font-size: 17px;
  margin-bottom: 30px;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #777;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>カートに追加しました</h1>

    <div id="menuName" class="menu-name"></div>

    <div class="message">
      このメニューをカートに追加しました。
    </div>

  </div>

  <div id="status"></div>

</div>


<script>

const LIFF_ID = "2011037691-j7UfaGxQ";

const CART_KEY = "salon_cart";


/* =========================
   URLからメニュー取得
========================= */

function getMenuFromURL() {

  const params =
    new URLSearchParams(window.location.search);

  const menuId =
    params.get("menu") || "face_all";


  const menuNames = {

    face_all: "顔全体",

    face_upper: "上顔面",

    face_lower: "下顔面"

  };


  const menuPrices = {

    face_all: "5000",

    face_upper: "3000",

    face_lower: "3000"

  };


  const menuTimes = {

    face_all: "30",

    face_upper: "30",

    face_lower: "30"

  };


  return {

    menu: menuId,

    name:
      menuNames[menuId] || "メニュー",

    price:
      menuPrices[menuId] || "0",

    time:
      menuTimes[menuId] || "0"

  };

}


/* =========================
   カート取得
========================= */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);

  if (!saved) {
    return [];
  }

  try {

    return JSON.parse(saved);

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* =========================
   カート保存
========================= */

function saveToCart(menu) {

  const cart = getCart();

  /*
   * 同じメニューがあれば
   * 二重追加しない
   */

  const alreadyAdded =
    cart.some(
      item => item.menu === menu.menu
    );

  if (!alreadyAdded) {

    cart.push(menu);

  }

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  console.log(
    "現在のカート：",
    cart
  );

}


/* =========================
   LINEへ送信
========================= */

async function sendCartAddedMessage() {

  await liff.sendMessages([
    {
      type: "text",
      text: "【カートに追加しました】"
    }
  ]);

}


/* =========================
   LIFFを閉じる
========================= */

function closeLIFF() {

  if (liff.isInClient()) {

    console.log(
      "LIFFを閉じます"
    );

    setTimeout(function() {

      liff.closeWindow();

    }, 500);

  } else {

    console.log(
      "LIFFブラウザではありません"
    );

  }

}


/* =========================
   メイン処理
========================= */

async function main() {

  const menu =
    getMenuFromURL();

  document.getElementById(
    "menuName"
  ).textContent = menu.name;

  try {

    /*
     * LIFF初期化
     */

    await liff.init({
      liffId: LIFF_ID
    });

    console.log(
      "LIFF初期化成功"
    );


    /*
     * カートへ保存
     */

    saveToCart(menu);

    console.log(
      "カート保存成功"
    );


    /*
     * LINEへ
     * 「カートに追加しました」
     */

    try {

      await sendCartAddedMessage();

      console.log(
        "LINE送信成功"
      );

    } catch (error) {

      console.error(
        "LINE送信エラー：",
        error
      );

    }


    /*
     * LIFFを閉じる
     */

    closeLIFF();

  } catch (error) {

    console.error(
      "エラー：",
      error
    );

    document.getElementById(
      "status"
    ).textContent =
      "エラー：" +
      error.message;

  }

}


/* =========================
   ページ読み込み時に実行
========================= */

window.addEventListener(
  "DOMContentLoaded",
  main
);

</script>

</body>
</html>
