<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>メニュー</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 50px 20px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 35px 25px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  text-align: center;
}

h1 {
  font-size: 28px;
  margin: 0 0 25px;
}

.menu-name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 15px;
}

.message {
  color: #777;
  font-size: 17px;
  line-height: 1.7;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #888;
  font-size: 14px;
}

.hidden {
  display: none;
}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1 id="title">
      処理中…
    </h1>

    <div
      id="menuName"
      class="menu-name"
    ></div>

    <div
      id="message"
      class="message"
    ></div>

  </div>

  <div id="status"></div>

</div>


<script>

/* =========================
   LIFF設定
========================= */

const LIFF_ID =
  "2011037691-j7UfaGxQ";


/* =========================
   カート保存場所
========================= */

const CART_KEY =
  "salon_cart";


/* =========================
   メニュー情報
========================= */

const MENUS = {

  face_all: {
    menu: "face_all",
    name: "顔全体",
    price: 5000,
    time: 30
  },

  face_upper: {
    menu: "face_upper",
    name: "上顔面",
    price: 3000,
    time: 30
  },

  face_lower: {
    menu: "face_lower",
    name: "下顔面",
    price: 3000,
    time: 30
  }

};


/* =========================
   カート取得
========================= */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);

  if (!saved) {
    return [];
  }

  try {

    const cart =
      JSON.parse(saved);

    return Array.isArray(cart)
      ? cart
      : [];

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* =========================
   カート保存
========================= */

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* =========================
   URLからメニュー取得
========================= */

function getMenuFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const menuId =
    params.get("menu");

  return MENUS[menuId] || null;

}


/* =========================
   カートへ追加
========================= */

function addToCart(menu) {

  const cart =
    getCart();

  const alreadyAdded =
    cart.some(
      item =>
        item.menu === menu.menu
    );

  if (!alreadyAdded) {

    cart.push(menu);

    saveCart(cart);

  }

}


/* =========================
   LINEメッセージ送信
========================= */

async function sendCartAddedMessage() {

  await liff.sendMessages([

    {
      type: "text",
      text: "カートに追加しました"
    }

  ]);

}


/* =========================
   LIFFを閉じる
========================= */

function closeLIFF() {

  setTimeout(function() {

    try {

      if (liff.isInClient()) {

        liff.closeWindow();

      }

    } catch (error) {

      console.error(
        "LIFF終了エラー",
        error
      );

    }

  }, 500);

}


/* =========================
   メニュー追加処理
========================= */

async function addMenu() {

  const menu =
    getMenuFromURL();


  if (!menu) {

    document.getElementById(
      "title"
    ).textContent =
      "エラー";

    document.getElementById(
      "status"
    ).textContent =
      "メニュー情報がありません。";

    return;

  }


  /*
   * 画面表示
   */

  document.getElementById(
    "title"
  ).textContent =
    "カートに追加しました";

  document.getElementById(
    "menuName"
  ).textContent =
    menu.name;

  document.getElementById(
    "message"
  ).textContent =
    "このメニューをカートに追加しました。";


  try {

    /*
     * カート保存
     */

    addToCart(menu);


    /*
     * LIFF初期化
     */

    await liff.init({

      liffId:
        LIFF_ID

    });


    /*
     * LINEアプリ内確認
     */

    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    /*
     * LINEへ送信
     */

    await sendCartAddedMessage();


    /*
     * 自動で閉じる
     */

    closeLIFF();


  } catch (error) {

    console.error(
      "カート追加エラー",
      error
    );

    document.getElementById(
      "status"
    ).textContent =
      "エラー：" +
      error.message;

  }

}


/* =========================
   起動
========================= */

window.addEventListener(

  "DOMContentLoaded",

  addMenu

);

</script>

</body>

</html>
