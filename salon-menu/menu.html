/* ==================================================
   LIFF
================================================== */

let liffInitialized = false;
let liffInitializing = false;


async function initLIFF() {

  if (liffInitialized) {
    return;
  }

  if (liffInitializing) {

    while (liffInitializing) {

      await new Promise(
        resolve =>
          setTimeout(resolve, 50)
      );

    }

    return;

  }

  liffInitializing = true;

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    liffInitialized = true;

  } finally {

    liffInitializing = false;

  }

}


/* ==================================================
   カート取得
================================================== */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);

  if (!saved) {
    return [];
  }

  try {

    const cart =
      JSON.parse(saved);

    return Array.isArray(cart)
      ? cart
      : [];

  } catch {

    return [];

  }

}


/* ==================================================
   カート保存
================================================== */

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* ==================================================
   追加済みメニュー表示
================================================== */

function renderSelectedMenus() {

  const cart =
    getCart();

  const box =
    document.getElementById(
      "selectedBox"
    );

  const list =
    document.getElementById(
      "selectedList"
    );


  if (cart.length === 0) {

    box.classList.add(
      "hidden"
    );

    list.innerHTML = "";

    return;

  }


  box.classList.remove(
    "hidden"
  );


  list.innerHTML =
    cart.map(
      item => `

        <div class="selected-item">

          <div class="selected-name">
            ${escapeHTML(item.name)}
          </div>

          <div class="selected-detail">
            ¥${Number(item.price).toLocaleString("ja-JP")}
            ｜約${Number(item.time)}分
          </div>

        </div>

      `
    ).join("");

}


/* ==================================================
   メニュー追加
================================================== */

async function addMenu(menuId) {

  const menu =
    MENUS[menuId];


  if (!menu) {

    showError(
      "メニュー情報を取得できませんでした。"
    );

    return;

  }


  const cart =
    getCart();


  const exists =
    cart.some(
      item =>
        item.menu === menuId
    );


  if (!exists) {

    cart.push({

      menu: menuId,

      name: menu.name,

      price: menu.price,

      time: menu.time

    });

    saveCart(cart);

  }


  /* ★ここが今回の重要部分 */

  renderSelectedMenus();


  /* LINE送信 */

  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    await liff.sendMessages([

      {
        type: "text",
        text: "カートに追加しました"
      }

    ]);


    /* 少し待って閉じる */

    setTimeout(
      function() {

        try {

          liff.closeWindow();

        } catch {}

      },
      500
    );


  } catch (error) {

    console.error(
      error
    );

    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );

  }

}

    cart.map(
      (item,index) => `

        <div class="cart-item">

          <div class="item-name">
            ${escapeHTML(item.name)}
          </div>

          <div class="item-bottom">

            <span>
              約${Number(item.time)}分
            </span>

            <span>
              ¥${Number(item.price).toLocaleString("ja-JP")}
            </span>

          </div>

          <button
            type="button"
            class="delete-button"
            onclick="removeItem(${index})"
          >
            削除
          </button>

        </div>

      `
    ).join("");


  let totalPrice = 0;
  let totalTime = 0;


  cart.forEach(
    item => {

      totalPrice +=
        Number(item.price) || 0;

      totalTime +=
        Number(item.time) || 0;

    }
  );


  document.getElementById(
    "totalPrice"
  ).textContent =
    "¥" +
    totalPrice.toLocaleString("ja-JP");


  document.getElementById(
    "totalTime"
  ).textContent =
    totalTime + "分";

}


/* ==================================================
   削除
================================================== */

function removeItem(index) {

  const cart =
    getCart();

  cart.splice(
    index,
    1
  );

  saveCart(cart);

  renderCart();

  renderSelectedMenus();

}


/* ==================================================
   カートを空にする
================================================== */

function clearCart() {

  if (
    getCart().length === 0
  ) {

    return;

  }


  if (
    !confirm(
      "カートを空にしますか？"
    )
  ) {

    return;

  }


  localStorage.removeItem(
    CART_KEY
  );

  renderCart();

  renderSelectedMenus();

}


/* ==================================================
   カート画面
================================================== */

function showCartScreen() {

  document.getElementById(
    "menuScreen"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "cartScreen"
  ).classList.remove(
    "hidden"
  );


  renderCart();

}


/* ==================================================
   メニュー追加ボタン
================================================== */

async function menuAddFromCart() {

  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    await liff.sendMessages([

      {
        type: "text",
        text: "メニュー追加"
      }

    ]);


    /*
     * 送信後にメニュー選択画面へ
     */

    setTimeout(
      function() {

        showMenuScreen();

      },
      300
    );


  } catch (error) {

    showError(
      "メニュー追加の送信に失敗しました。\n" +
      error.message
    );

  }

}


/* ==================================================
   メニュー画面
================================================== */

function showMenuScreen() {

  document.getElementById(
    "cartScreen"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "menuScreen"
  ).classList.remove(
    "hidden"
  );


  renderSelectedMenus();

}


/* ==================================================
   選択完了
================================================== */

async function completeSelection() {

  const cart =
    getCart();


  if (
    cart.length === 0
  ) {

    alert(
      "メニューを選択してください。"
    );

    return;

  }


  const button =
    document.getElementById(
      "completeButton"
    );


  button.disabled = true;

  button.textContent =
    "送信中…";


  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    let totalPrice = 0;
    let totalTime = 0;


    let message =
      "【選択したメニュー一覧】\n\n";


    cart.forEach(
      item => {

        const price =
          Number(item.price) || 0;

        const time =
          Number(item.time) || 0;


        message +=
          "✔ " +
          item.name +
          "　¥" +
          price.toLocaleString("ja-JP") +
          "｜約" +
          time +
          "分\n";


        totalPrice +=
          price;

        totalTime +=
          time;

      }
    );


    message +=
      "\n■ 合計金額\n¥" +
      totalPrice.toLocaleString("ja-JP");


    message +=
      "\n\n■ 施術時間目安\n" +
      totalTime +
      "分";


    message +=
      "\n\nこちらの内容でよろしいですか？";


    await liff.sendMessages([

      {
        type: "text",
        text: message
      }

    ]);


    localStorage.removeItem(
      CART_KEY
    );


    setTimeout(
      function() {

        try {

          liff.closeWindow();

        } catch {}

      },
      500
    );


  } catch (error) {

    console.error(
      error
    );


    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );


    button.disabled = false;

    button.textContent =
      "選択完了";

  }

}


/* ==================================================
   エラー
================================================== */

function showError(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* ==================================================
   起動
================================================== */

async function startPage() {

  try {

    await initLIFF();


    const params =
      new URLSearchParams(
        window.location.search
      );


    /* カートを見る */

    if (
      params.get("mode") === "cart"
    ) {

      showCartScreen();

      return;

    }


    /* メニュー指定 */

    const menuId =
      params.get("menu");


    if (menuId) {

      /*
       * メニュー選択画面を表示したまま
       * 指定メニューを追加
       */

      showMenuScreen();

      await addMenu(menuId);

      return;

    }


    showMenuScreen();

  } catch (error) {

    console.error(
      error
    );

    showError(
      "LIFFの起動に失敗しました。\n" +
      error.message
    );

  }

}


window.addEventListener(
  "DOMContentLoaded",
  startPage
);

</script>
