<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>カート</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 50px 20px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 35px 25px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  text-align: center;
}

h1 {
  font-size: 28px;
  margin: 0 0 25px;
}

.menu-name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 15px;
}

.message {
  color: #777;
  font-size: 17px;
  margin-bottom: 30px;
}

button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 18px;
  font-size: 18px;
  font-weight: 700;
  background: #333;
  color: #fff;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #777;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>カートに追加</h1>

    <div id="menuName" class="menu-name">
      読み込み中...
    </div>

    <div class="message">
      このメニューをカートに追加しました。
    </div>

    <button onclick="sendToLINE()">
      LINEへ送信
    </button>

  </div>

  <div id="status"></div>

</div>

<script>

const LIFF_ID = "2011037691-j7UfaGxQ";

let menuName = "";

/* =========================
   URLからメニューを取得
========================= */

function getMenuFromURL() {

  const params =
    new URLSearchParams(window.location.search);

  menuName = params.get("menu");

  if (!menuName) {

    menuName = "顔全体";

  }

  document.getElementById("menuName").textContent =
    menuName;

}


/* =========================
   LIFF初期化
========================= */

window.addEventListener(
  "DOMContentLoaded",
  async function() {

    getMenuFromURL();

    try {

      await liff.init({
        liffId: LIFF_ID
      });

      console.log("LIFF初期化成功");

    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "LIFF初期化エラー：" +
        error.message;

    }

  }
);


/* =========================
   LINEへ送信
========================= */

async function sendToLINE() {

  try {

    await liff.sendMessages([
      {
        type: "text",
        text:
          "カート追加：" + menuName
      }
    ]);

    document.getElementById("status").textContent =
      "カート情報を送信しました。";

    /*
     * LINE内で開いている場合だけ閉じる
     */

    if (liff.isInClient()) {

      setTimeout(function() {

        liff.closeWindow();

      }, 500);

    }

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "送信に失敗しました：" +
      error.message;

  }

}

</script>

</body>
</html>
