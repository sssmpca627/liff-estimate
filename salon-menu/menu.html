<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>選択したメニュー</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 40px 20px;
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

h1 {
  font-size: 28px;
  margin: 0 0 15px;
}

.subtitle {
  color: #777;
  font-size: 16px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 25px 20px;
  margin-bottom: 15px;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
}

.menu-name {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 10px;
}

.menu-info {
  color: #666;
  font-size: 16px;
}

.summary {
  background: #fff;
  border-radius: 24px;
  padding: 25px 20px;
  margin-top: 20px;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
}

.summary-row {
  display: flex;
  justify-content: space-between;
  font-size: 17px;
  margin-bottom: 12px;
}

.summary-row:last-child {
  margin-bottom: 0;
}

.total {
  font-size: 22px;
  font-weight: 700;
}

.empty {
  background: #fff;
  border-radius: 24px;
  padding: 70px 20px;
  text-align: center;

  color: #777;
  font-size: 18px;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
}

.line-button {
  width: 100%;
  border: none;
  border-radius: 20px;

  background: #333;
  color: #fff;

  font-size: 18px;
  font-weight: 700;

  padding: 20px;

  margin-top: 25px;
}

#status {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-top: 15px;
}

</style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>
      選択したメニュー
    </h1>

    <div class="subtitle">
      現在カートに入っているメニューです。
    </div>

  </div>


  <div id="cartList"></div>


  <div
    id="summary"
    style="display:none;"
    class="summary"
  >

    <div class="summary-row">

      <span>
        施術時間目安
      </span>

      <span id="totalTime">
        約0分
      </span>

    </div>


    <div class="summary-row">

      <span>
        合計
      </span>

      <span
        id="totalPrice"
        class="total"
      >
        ¥0
      </span>

    </div>


    <button
      id="sendButton"
      class="line-button"
    >
      この内容をLINEに送信
    </button>

  </div>


  <div id="status"></div>


</div>



<script>


/* =========================
   設定
========================= */

const LIFF_ID =
  "2011037691-j7UfaGxQ";

const CART_KEY =
  "salon_cart";


/* =========================
   カート取得
========================= */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);

  if (!saved) {
    return [];
  }

  try {

    return JSON.parse(saved);

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* =========================
   カート表示
========================= */

function displayCart() {

  const cart =
    getCart();

  const cartList =
    document.getElementById(
      "cartList"
    );


  if (cart.length === 0) {

    cartList.innerHTML = `
      <div class="empty">
        カートは空です。
      </div>
    `;

    return;

  }


  let totalPrice = 0;
  let totalTime = 0;


  cartList.innerHTML = "";


  cart.forEach(function(item) {

    const price =
      Number(item.price) || 0;

    const time =
      Number(item.time) || 0;


    totalPrice += price;
    totalTime += time;


    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <div class="menu-name">
        ${item.name}
      </div>

      <div class="menu-info">
        ¥${price.toLocaleString()}
        ｜約${time}分
      </div>

    `;


    cartList.appendChild(card);

  });


  document.getElementById(
    "totalPrice"
  ).textContent =
    "¥" +
    totalPrice.toLocaleString();


  document.getElementById(
    "totalTime"
  ).textContent =
    "約" +
    totalTime +
    "分";


  document.getElementById(
    "summary"
  ).style.display =
    "block";

}


/* =========================
   LINE送信
========================= */

async function sendToLINE() {

  const cart =
    getCart();


  if (cart.length === 0) {

    return;

  }


  let message =
    "【選択したメニュー】\n\n";


  cart.forEach(function(item) {

    const price =
      Number(item.price) || 0;

    const time =
      Number(item.time) || 0;


    message +=
      "・" +
      item.name +
      "\n";

    message +=
      "　¥" +
      price.toLocaleString() +
      "｜約" +
      time +
      "分\n\n";

  });


  let totalPrice = 0;
  let totalTime = 0;


  cart.forEach(function(item) {

    totalPrice +=
      Number(item.price) || 0;

    totalTime +=
      Number(item.time) || 0;

  });


  message +=
    "合計：¥" +
    totalPrice.toLocaleString() +
    "\n";

  message +=
    "施術時間目安：約" +
    totalTime +
    "分";


  try {

    await liff.sendMessages([

      {
        type: "text",
        text: message
      }

    ]);


    document.getElementById(
      "status"
    ).textContent =
      "LINEに送信しました。";


  } catch (error) {

    console.error(
      "LINE送信エラー",
      error
    );


    document.getElementById(
      "status"
    ).textContent =
      "LINEへの送信に失敗しました。";

  }

}


/* =========================
   メイン
========================= */

async function main() {

  try {

    await liff.init({

      liffId:
        LIFF_ID

    });


    displayCart();


    document
      .getElementById("sendButton")
      .addEventListener(
        "click",
        sendToLINE
      );


  } catch (error) {

    console.error(
      "LIFF初期化エラー",
      error
    );


    document.getElementById(
      "status"
    ).textContent =
      "エラー：" +
      error.message;

  }

}


/* =========================
   起動
========================= */

window.addEventListener(
  "DOMContentLoaded",
  main
);

</script>


</body>
</html>
