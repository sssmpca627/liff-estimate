/* ==================================================
   LIFF
================================================== */

let liffInitialized = false;
let liffInitializing = false;


async function initLIFF() {

  if (liffInitialized) {
    return;
  }

  if (liffInitializing) {

    while (liffInitializing) {

      await new Promise(
        resolve => setTimeout(resolve, 50)
      );

    }

    return;

  }

  liffInitializing = true;

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    liffInitialized = true;

  } finally {

    liffInitializing = false;

  }

}


/* ==================================================
   カート取得
================================================== */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);

  if (!saved) {
    return [];
  }

  try {

    const cart =
      JSON.parse(saved);

    return Array.isArray(cart)
      ? cart
      : [];

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* ==================================================
   カート保存
================================================== */

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* ==================================================
   メニュー追加
================================================== */

async function addMenu(menuId) {

  const menu =
    MENUS[menuId];


  if (!menu) {

    showError(
      "メニュー情報を取得できませんでした。"
    );

    return;

  }


  const cart =
    getCart();


  const alreadyAdded =
    cart.some(
      item =>
        item.menu === menuId
    );


  if (!alreadyAdded) {

    cart.push({
      menu: menu.menu,
      name: menu.name,
      category: menu.category,
      price: menu.price,
      time: menu.time
    });

    saveCart(cart);

  }


  /*
   * LINEには
   * 「カートに追加しました」
   * だけ送信
   */

  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    await liff.sendMessages([
      {
        type: "text",
        text: "カートに追加しました"
      }
    ]);


    /*
     * 送信成功後に自動終了
     */

    setTimeout(
      function() {

        try {

          if (liff.isInClient()) {
            liff.closeWindow();
          }

        } catch (error) {

          console.error(
            "LIFF終了エラー",
            error
          );

        }

      },
      700
    );


  } catch (error) {

    console.error(
      "メニュー追加エラー",
      error
    );

    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );

  }

}


/* ==================================================
   カート表示
================================================== */

function renderCart() {

  const cart =
    getCart();


  const list =
    document.getElementById(
      "cartList"
    );


  if (cart.length === 0) {

    list.innerHTML =
      '<div style="text-align:center;padding:30px;color:#888;">カートは空です</div>';

    document.getElementById(
      "totalPrice"
    ).textContent =
      "¥0";

    document.getElementById(
      "totalTime"
    ).textContent =
      "0分";

    return;

  }


  list.innerHTML =
    cart.map(
      (item, index) => `

        <div class="cart-item">

          <div class="item-name">
            ${escapeHTML(
              item.name || "メニュー"
            )}
          </div>

          <div class="item-bottom">

            <span>
              約${Number(item.time) || 0}分
            </span>

            <span>
              ¥${(
                Number(item.price) || 0
              ).toLocaleString("ja-JP")}
            </span>

          </div>

          <button
            type="button"
            class="delete-button"
            onclick="removeItem(${index})"
          >
            削除
          </button>

        </div>

      `
    ).join("");


  let totalPrice = 0;
  let totalTime = 0;


  cart.forEach(
    item => {

      totalPrice +=
        Number(item.price) || 0;

      totalTime +=
        Number(item.time) || 0;

    }
  );


  document.getElementById(
    "totalPrice"
  ).textContent =
    "¥" +
    totalPrice.toLocaleString("ja-JP");


  document.getElementById(
    "totalTime"
  ).textContent =
    totalTime + "分";

}


/* ==================================================
   メニュー追加画面
================================================== */

  list.innerHTML =

      .map(
        menu => `

          <button
            type="button"
            class="menu-button"
            style="
              width:100%;
              background:#fff;
              border:1px solid #ddd;
              border-radius:18px;
              padding:18px;
              margin-bottom:10px;
              text-align:left;
            "
            onclick="addMenu('${menu.menu}')"
          >

            <div
              style="
                font-size:19px;
                font-weight:700;
              "
            >
              ${escapeHTML(menu.name)}
            </div>

            <div
              style="
                margin-top:7px;
                color:#777;
                font-size:15px;
              "
            >
              ${escapeHTML(menu.category)}
              ｜¥${menu.price.toLocaleString("ja-JP")}
              ｜約${menu.time}分
            </div>

          </button>

        `
      )
      .join("");

}


/* ==================================================
   削除
================================================== */

function removeItem(index) {

  const cart =
    getCart();

  cart.splice(
    index,
    1
  );

  saveCart(cart);

  renderCart();

}


/* ==================================================
   カートを空にする
================================================== */

function clearCart() {

  if (
    getCart().length === 0
  ) {

    return;

  }


  if (
    !confirm(
      "カートを空にしますか？"
    )
  ) {

    return;

  }


  localStorage.removeItem(
    CART_KEY
  );

  renderCart();

}


/* ==================================================
   メニュー追加ボタン
================================================== */

function addMoreMenu() {

  document.getElementById(
    "cartScreen"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "menuScreen"
  ).classList.remove(
    "hidden"
  );


  renderMenuList();

}


/* ==================================================
   カート画面
================================================== */

function showCartScreen() {

  document.getElementById(
    "menuScreen"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "cartScreen"
  ).classList.remove(
    "hidden"
  );


  renderCart();

}


/* ==================================================
   選択完了
================================================== */

async function completeSelection() {

  const cart =
    getCart();


  if (
    cart.length === 0
  ) {

    alert(
      "メニューを選択してください。"
    );

    return;

  }


  const button =
    document.getElementById(
      "completeButton"
    );


  button.disabled = true;

  button.textContent =
    "送信中…";


  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    let totalPrice = 0;
    let totalTime = 0;


    let message =
      "【選択したメニュー一覧】\n\n";


    cart.forEach(
      item => {

        const price =
          Number(item.price) || 0;

        const time =
          Number(item.time) || 0;


        message +=
          "✔ " +
          item.name +
          "　¥" +
          price.toLocaleString("ja-JP") +
          "｜約" +
          time +
          "分\n";


        totalPrice +=
          price;

        totalTime +=
          time;

      }
    );


    message +=
      "\n■ 合計金額\n¥" +
      totalPrice.toLocaleString("ja-JP");


    message +=
      "\n\n■ 施術時間目安\n" +
      totalTime +
      "分";


    message +=
      "\n\nこちらの内容でよろしいですか？";


    await liff.sendMessages([
      {
        type: "text",
        text: message
      }
    ]);


    /*
     * 送信成功後のみ
     * カートを空にする
     */

    localStorage.removeItem(
      CART_KEY
    );


    setTimeout(
      function() {

        try {

          if (liff.isInClient()) {
            liff.closeWindow();
          }

        } catch (error) {

          console.error(
            "LIFF終了エラー",
            error
          );

        }

      },
      700
    );


  } catch (error) {

    console.error(
      "選択完了エラー",
      error
    );


    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );


    button.disabled = false;

    button.textContent =
      "選択完了";

  }

}


/* ==================================================
   エラー
================================================== */

function showError(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==================================================
   起動
================================================== */

async function startPage() {

  try {

    await initLIFF();


    const params =
      new URLSearchParams(
        window.location.search
      );


    /*
     * カートを見る
     * ?mode=cart
     */

    if (
      params.get("mode") === "cart"
    ) {

      showCartScreen();

      return;

    }


    /*
     * menu=指定
     *
     * 例：
     * ?menu=face_all
     */

    const menuId =
      params.get("menu");


    if (menuId) {

      /*
       * メニューを追加した後、
       * メニュー選択画面には戻さない。
       *
       * カート画面を表示して、
       * 追加されたメニューを確認できるようにする。
       */

      const menu =
        MENUS[menuId];


      if (!menu) {

        showError(
          "指定されたメニューが見つかりません。\n" +
          "menu=" + menuId
        );

        return;

      }


      const cart =
        getCart();


      const alreadyAdded =
        cart.some(
          item =>
            item.menu === menuId
        );


      if (!alreadyAdded) {

        cart.push({
          menu: menu.menu,
          name: menu.name,
          category: menu.category,
          price: menu.price,
          time: menu.time
        });

        saveCart(cart);

      }


      /*
       * 追加したメニューを画面に表示
       */

      showCartScreen();


      /*
       * LINEへは
       * 「カートに追加しました」
       * だけ送信
       */

      try {

        await liff.sendMessages([
          {
            type: "text",
            text: "カートに追加しました"
          }
        ]);


        /*
         * 送信後に自動終了
         */

        setTimeout(
          function() {

            try {

              if (liff.isInClient()) {
                liff.closeWindow();
              }

            } catch (error) {

              console.error(
                "LIFF終了エラー",
                error
              );

            }

          },
          700
        );


      } catch (error) {

        console.error(
          "カート追加送信エラー",
          error
        );

        showError(
          "LINEへの送信に失敗しました。\n" +
          error.message
        );

      }


      return;

    }


    /*
     * URL指定がない場合
     */

    showCartScreen();


  } catch (error) {

    console.error(
      "起動エラー",
      error
    );


    showError(
      "LIFFの起動に失敗しました。\n" +
      error.message
    );

  }

}


/* ==================================================
   起動
================================================== */

window.addEventListener(
  "DOMContentLoaded",
  startPage
);

</script>
