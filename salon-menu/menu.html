<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>メニュー</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 50px 20px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 35px 25px;
  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
  text-align: center;
}

h1 {
  font-size: 28px;
  margin: 0 0 25px;
}

.menu-name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 15px;
}

.message {
  color: #777;
  font-size: 17px;
  line-height: 1.7;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #888;
  font-size: 14px;
  line-height: 1.6;
}

</style>

</head>


<body>


<div class="container">

  <div class="card">

    <h1 id="title">
      処理中…
    </h1>

    <div
      id="menuName"
      class="menu-name"
    ></div>

    <div
      id="message"
      class="message"
    ></div>

  </div>

  <div id="status"></div>

</div>


<script>


/* ==================================================
   LIFF
================================================== */

const LIFF_ID =
  "2011037691-j7UfaGxQ";


/* ==================================================
   カート
================================================== */

const CART_KEY =
  "salon_cart";


/* ==================================================
   メニュー
================================================== */

const MENUS = {

  face_all: {
    menu: "face_all",
    name: "顔全体",
    price: 5000,
    time: 30
  },

  face_upper: {
    menu: "face_upper",
    name: "上顔面",
    price: 3000,
    time: 30
  },

  face_lower: {
    menu: "face_lower",
    name: "下顔面",
    price: 3000,
    time: 30
  }

};


/* ==================================================
   カート取得
================================================== */

function getCart() {

  const saved =
    localStorage.getItem(
      CART_KEY
    );

  if (!saved) {

    return [];

  }

  try {

    const cart =
      JSON.parse(saved);

    if (!Array.isArray(cart)) {

      return [];

    }

    return cart;

  } catch (error) {

    console.error(
      error
    );

    return [];

  }

}


/* ==================================================
   カート保存
================================================== */

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* ==================================================
   カート追加
================================================== */

function addToCart(menu) {

  const cart =
    getCart();

  const exists =
    cart.some(
      item =>
        item.menu === menu.menu
    );

  if (!exists) {

    cart.push(menu);

  }

  saveCart(cart);

}


/* ==================================================
   LINE送信
================================================== */

async function sendAddedMessage() {

  await liff.sendMessages([

    {
      type: "text",
      text: "カートに追加しました"
    }

  ]);

}


/* ==================================================
   LIFF終了
================================================== */

function closeLIFF() {

  setTimeout(
    () => {

      if (
        liff.isInClient()
      ) {

        liff.closeWindow();

      }

    },
    500
  );

}


/* ==================================================
   エラー
================================================== */

function showError(message) {

  document.getElementById(
    "title"
  ).textContent =
    "エラー";

  document.getElementById(
    "menuName"
  ).textContent =
    "";

  document.getElementById(
    "message"
  ).textContent =
    "";

  document.getElementById(
    "status"
  ).textContent =
    message;

}


/* ==================================================
   URLからパラメータ取得
================================================== */

function getParameter(name) {

  /*
   * まず通常のURLを確認
   */

  const currentParams =
    new URLSearchParams(
      window.location.search
    );

  let value =
    currentParams.get(name);

  if (value) {

    return value;

  }


  /*
   * 次にLIFFのstateを確認
   */

  const state =
    liff.getDecodedIDToken
      ? null
      : liff.state;


  if (state) {

    const stateParams =
      new URLSearchParams(
        state.startsWith("?")
          ? state.substring(1)
          : state
      );

    value =
      stateParams.get(name);

    if (value) {

      return value;

    }

  }


  return null;

}


/* ==================================================
   メニュー追加
================================================== */

async function processMenu(menuId) {

  const menu =
    MENUS[menuId];


  if (!menu) {

    showError(
      "メニュー情報を取得できませんでした。"
    );

    return;

  }


  /*
   * 画面表示
   */

  document.getElementById(
    "title"
  ).textContent =
    "カートに追加しました";

  document.getElementById(
    "menuName"
  ).textContent =
    menu.name;

  document.getElementById(
    "message"
  ).textContent =
    "このメニューをカートに追加しました。";


  try {


    /*
     * ① カート追加
     */

    addToCart(menu);


    /*
     * ② LINE送信
     */

    await sendAddedMessage();


    /*
     * ③ 自動終了
     */

    closeLIFF();


  } catch (error) {

    console.error(
      "カート追加エラー",
      error
    );

    showError(
      "エラー：" +
      error.message
    );

  }

}


/* ==================================================
   メイン
================================================== */

async function main() {

  try {


    /*
     * ① LIFF初期化
     */

    await liff.init({

      liffId:
        LIFF_ID

    });


    console.log(
      "LIFF初期化成功"
    );


    /*
     * ② LINE内確認
     */

    if (
      !liff.isInClient()
    ) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    /*
     * ③ menu取得
     *
     * search と state の両方を見る
     */

    const menuId =
      getParameter("menu");


    console.log(
      "取得したmenu:",
      menuId
    );


    /*
     * ④ menuがあれば
     *    直接カート追加
     */

    if (menuId) {

      await processMenu(
        menuId
      );

      return;

    }


    /*
     * ⑤ mode=cart は
     *    今回のメニュー追加処理では触らない
     */

    const mode =
      getParameter("mode");


    if (
      mode === "cart"
    ) {

      /*
       * カート画面側の処理へ
       *
       * ここではメニュー追加をしない
       */

      window.location.href =
        "/salon-menu/cart.html";

      return;

    }


    /*
     * ⑥ どちらでもない場合
     */

    showError(
      "メニューが指定されていません。"
    );


  } catch (error) {

    console.error(
      "メイン処理エラー",
      error
    );

    showError(
      "エラー：" +
      error.message
    );

  }

}


/* ==================================================
   起動
================================================== */

window.addEventListener(
  "DOMContentLoaded",
  main
);

</script>

</body>

</html>
