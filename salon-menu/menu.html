<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>メニュー選択</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 28px 20px;
  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
}

h1 {
  text-align: center;
  font-size: 27px;
  margin: 0 0 10px;
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 15px;
  margin-bottom: 25px;
}

.cart-item {
  border: 1px solid #e3e3e3;
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 12px;
}

.item-name {
  font-size: 19px;
  font-weight: 700;
}

.item-bottom {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  color: #777;
}

.delete-button {
  margin-top: 12px;
  border: none;
  background: transparent;
  color: #999;
  padding: 0;
  cursor: pointer;
}

.total {
  border-top: 1px solid #ddd;
  margin-top: 22px;
  padding-top: 20px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 13px;
}

.total-label {
  color: #666;
}

.total-value {
  font-size: 21px;
  font-weight: 700;
}

.button {
  width: 100%;
  border-radius: 16px;
  padding: 16px;
  font-size: 17px;
  font-weight: 700;
  margin-top: 12px;
  cursor: pointer;
}

.add-button {
  background: #fff;
  border: 1px solid #ccc;
  color: #333;
}

.complete-button {
  background: #333;
  border: 1px solid #333;
  color: #fff;
}

.clear-button {
  display: block;
  margin: 20px auto 0;
  border: none;
  background: transparent;
  color: #aaa;
  cursor: pointer;
}

#status {
  text-align: center;
  color: #888;
  font-size: 14px;
  margin-top: 18px;
  white-space: pre-line;
}

.hidden {
  display: none;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #888;
}

</style>

</head>


<body>


<div class="container">

<div class="card">


<!-- ==================================================
     カート画面
================================================== -->

<div id="cartScreen">

<h1>
選択したメニュー
</h1>

<div class="subtitle">
ご希望のメニューをご確認ください
</div>

<div id="cartList"></div>


<div class="total">

<div class="total-row">

<div class="total-label">
合計金額
</div>

<div
  id="totalPrice"
  class="total-value"
>
¥0
</div>

</div>


<div class="total-row">

<div class="total-label">
施術時間目安
</div>

<div
  id="totalTime"
  class="total-value"
>
0分
</div>

</div>

</div>


<!-- メニュー追加 -->

<button
  type="button"
  class="button add-button"
  onclick="addMoreMenu()"
>
メニュー追加
</button>


<!-- 選択完了 -->

<button
  type="button"
  id="completeButton"
  class="button complete-button"
  onclick="completeSelection()"
>
選択完了
</button>


<!-- カートを空にする -->

<button
  type="button"
  class="clear-button"
  onclick="clearCart()"
>
カートを空にする
</button>

</div>


</div>


<div id="status"></div>

</div>


<script>


/* ==================================================
   設定
================================================== */

const LIFF_ID =
  "2011037691-j7UfaGxQ";

const CART_KEY =
  "salon_cart";


/* ==================================================
   メニュー情報
================================================== */

const MENUS = {

  face_all: {
    menu: "face_all",
    name: "顔全体",
    price: 5000,
    time: 30
  },

  face_upper: {
    menu: "face_upper",
    name: "上顔面",
    price: 3000,
    time: 30
  },

  face_lower: {
    menu: "face_lower",
    name: "下顔面",
    price: 3000,
    time: 30
  }

};


/* ==================================================
   LIFF初期化
================================================== */

let liffInitialized = false;

let liffInitializing = false;


async function initLIFF() {

  if (liffInitialized) {
    return;
  }

  if (liffInitializing) {

    while (liffInitializing) {

      await new Promise(
        resolve =>
          setTimeout(resolve, 50)
      );

    }

    return;
  }

  liffInitializing = true;

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    liffInitialized = true;

  } finally {

    liffInitializing = false;

  }

}


/* ==================================================
   カート取得
================================================== */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);


  if (!saved) {
    return [];
  }


  try {

    const cart =
      JSON.parse(saved);


    if (!Array.isArray(cart)) {
      return [];
    }


    return cart;

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* ==================================================
   カート保存
================================================== */

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* ==================================================
   メニュー追加
================================================== */

async function addMenu(menuId) {

  console.log(
    "追加するメニュー：",
    menuId
  );


  const menu =
    MENUS[menuId];


  if (!menu) {

    showError(
      "メニューが指定されていません。\n" +
      "menu=" +
      menuId
    );

    return;

  }


  /* --------------------------------
     カート取得
  -------------------------------- */

  const cart =
    getCart();


  /* --------------------------------
     同じメニューの重複防止
  -------------------------------- */

  const alreadyAdded =
    cart.some(
      item =>
        item.menu === menuId
    );


  if (!alreadyAdded) {

    cart.push({

      menu: menu.menu,

      name: menu.name,

      price: menu.price,

      time: menu.time

    });


    saveCart(cart);

  }


  /* --------------------------------
     LINE送信
  -------------------------------- */

  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    await liff.sendMessages([

      {
        type: "text",
        text: "カートに追加しました"
      }

    ]);


    console.log(
      "カート追加メッセージ送信成功"
    );


    /* --------------------------------
       送信後に閉じる
    -------------------------------- */

    setTimeout(
      function() {

        try {

          liff.closeWindow();

        } catch (error) {

          console.error(
            "LIFF終了エラー",
            error
          );

        }

      },
      500
    );


  } catch (error) {

    console.error(
      "カート追加エラー",
      error
    );


    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );

  }

}


/* ==================================================
   カート表示
================================================== */

function renderCart() {

  const cart =
    getCart();


  const list =
    document.getElementById(
      "cartList"
    );


  /* --------------------------------
     カートが空
  -------------------------------- */

  if (cart.length === 0) {

    list.innerHTML =
      '<div class="empty">' +
      'カートは空です' +
      '</div>';


    document.getElementById(
      "totalPrice"
    ).textContent =
      "¥0";


    document.getElementById(
      "totalTime"
    ).textContent =
      "0分";


    return;

  }


  /* --------------------------------
     メニュー一覧表示
  -------------------------------- */

  list.innerHTML =
    cart.map(
      (item, index) => `

        <div class="cart-item">

          <div class="item-name">
            ${escapeHTML(
              item.name || "メニュー"
            )}
          </div>

          <div class="item-bottom">

            <span>
              約${Number(item.time) || 0}分
            </span>

            <span>
              ¥${(
                Number(item.price) || 0
              ).toLocaleString("ja-JP")}
            </span>

          </div>

          <button
            type="button"
            class="delete-button"
            onclick="removeItem(${index})"
          >
            削除
          </button>

        </div>

      `
    ).join("");


  /* --------------------------------
     合計
  -------------------------------- */

  let totalPrice = 0;

  let totalTime = 0;


  cart.forEach(
    item => {

      totalPrice +=
        Number(item.price) || 0;

      totalTime +=
        Number(item.time) || 0;

    }
  );


  document.getElementById(
    "totalPrice"
  ).textContent =
    "¥" +
    totalPrice.toLocaleString("ja-JP");


  document.getElementById(
    "totalTime"
  ).textContent =
    totalTime +
    "分";

}


/* ==================================================
   カート削除
================================================== */

function removeItem(index) {

  const cart =
    getCart();


  cart.splice(
    index,
    1
  );


  saveCart(cart);


  renderCart();

}


/* ==================================================
   カートを空にする
================================================== */

function clearCart() {

  const cart =
    getCart();


  if (cart.length === 0) {
    return;
  }


  if (
    !confirm(
      "カートを空にしますか？"
    )
  ) {

    return;

  }


  localStorage.removeItem(
    CART_KEY
  );


  renderCart();

}


/* ==================================================
   メニュー追加ボタン
================================================== */

async function addMoreMenu() {

  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    /*
     * LINEへ
     * 「メニュー追加」を送信
     */

    await liff.sendMessages([

      {
        type: "text",
        text: "メニュー追加"
      }

    ]);


    /*
     * 送信後に閉じる
     */

    setTimeout(
      function() {

        try {

          liff.closeWindow();

        } catch (error) {

          console.error(
            "LIFF終了エラー",
            error
          );

        }

      },
      500
    );


  } catch (error) {

    console.error(
      "メニュー追加エラー",
      error
    );


    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );

  }

}


/* ==================================================
   選択完了
================================================== */

async function completeSelection() {

  const cart =
    getCart();


  if (cart.length === 0) {

    alert(
      "メニューを選択してください。"
    );

    return;

  }


  const button =
    document.getElementById(
      "completeButton"
    );


  button.disabled = true;

  button.textContent =
    "送信中…";


  try {

    await initLIFF();


    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }


    let totalPrice = 0;

    let totalTime = 0;


    let message =
      "【選択したメニュー一覧】\n\n";


    /* --------------------------------
       選択メニュー
    -------------------------------- */

    cart.forEach(
      item => {

        const price =
          Number(item.price) || 0;

        const time =
          Number(item.time) || 0;


        message +=
          "✔ " +
          item.name +
          "　¥" +
          price.toLocaleString("ja-JP") +
          "｜約" +
          time +
          "分\n";


        totalPrice +=
          price;


        totalTime +=
          time;

      }
    );


    /* --------------------------------
       合計金額
    -------------------------------- */

    message +=
      "\n■ 合計金額\n¥" +
      totalPrice.toLocaleString("ja-JP");


    /* --------------------------------
       合計時間
    -------------------------------- */

    message +=
      "\n\n■ 施術時間目安\n" +
      totalTime +
      "分";


    /* --------------------------------
       確認文
    -------------------------------- */

    message +=
      "\n\nこちらの内容でよろしいですか？";


    /* --------------------------------
       LINE送信
    -------------------------------- */

    await liff.sendMessages([

      {
        type: "text",
        text: message
      }

    ]);


    /* --------------------------------
       送信成功後にカート削除
    -------------------------------- */

    localStorage.removeItem(
      CART_KEY
    );


    /* --------------------------------
       LIFFを閉じる
    -------------------------------- */

    setTimeout(
      function() {

        try {

          liff.closeWindow();

        } catch (error) {

          console.error(
            "LIFF終了エラー",
            error
          );

        }

      },
      500
    );


  } catch (error) {

    console.error(
      "選択完了エラー",
      error
    );


    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );


    button.disabled = false;

    button.textContent =
      "選択完了";

  }

}


/* ==================================================
   エラー表示
================================================== */

function showError(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==================================================
   ページ起動
================================================== */

async function startPage() {

  try {

    /*
     * LIFF初期化
     */

    await initLIFF();


    /*
     * URL取得
     */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const mode =
      params.get("mode");


    const menuId =
      params.get("menu");


    console.log(
      "mode=",
      mode,
      "menu=",
      menuId
    );


    /* =================================================
       ① カートを見る
       ?mode=cart
    ================================================= */

    if (mode === "cart") {

      renderCart();

      return;

    }


    /* =================================================
       ② メニュー追加URL
       ?menu=face_all
       ?menu=face_upper
       ?menu=face_lower
    ================================================= */

    if (menuId) {

      await addMenu(menuId);

      return;

    }


    /* =================================================
       ③ URL指定なし
    ================================================= */

    /*
     * メニュー選択画面は出さない
     */

    renderCart();

  } catch (error) {

    console.error(
      "起動エラー",
      error
    );


    showError(
      "LIFFの起動に失敗しました。\n" +
      error.message
    );

  }

}


/* ==================================================
   起動
================================================== */

window.addEventListener(
  "DOMContentLoaded",
  startPage
);

</script>


</body>

</html>
