/* ==================================================
   LIFF初期化
================================================== */

let liffInitialized = false;
let liffInitializing = false;

async function initLIFF() {

  if (liffInitialized) {
    return;
  }

  if (liffInitializing) {

    while (liffInitializing) {

      await new Promise(
        resolve =>
          setTimeout(resolve, 50)
      );

    }

    return;

  }

  liffInitializing = true;

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    liffInitialized = true;

  } finally {

    liffInitializing = false;

  }

}


/* ==================================================
   カート取得
================================================== */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);

  if (!saved) {
    return [];
  }

  try {

    const cart =
      JSON.parse(saved);

    return Array.isArray(cart)
      ? cart
      : [];

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* ==================================================
   カート保存
================================================== */

function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* ==================================================
   URLメニュー追加
================================================== */

async function addMenuFromURL(menuId) {

  const menu =
    MENUS[menuId];

  if (!menu) {

    showError(
      "メニュー情報がありません。\n" +
      menuId
    );

    showPage();

    return;

  }

  const cart =
    getCart();

  const exists =
    cart.some(
      item =>
        item.menu === menuId
    );

  if (!exists) {

    cart.push({
      menu: menu.menu,
      name: menu.name,
      category: menu.category,
      price: menu.price,
      time: menu.time
    });

    saveCart(cart);

  }

  renderCart();

  try {

    await initLIFF();

    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内で開いてください。"
      );

    }

    await liff.sendMessages([
      {
        type: "text",
        text: "カートに追加しました"
      }
    ]);

    setTimeout(
      () => {

        try {

          if (
            liff.isInClient()
          ) {

            liff.closeWindow();

          }

        } catch (error) {

          console.error(
            "closeWindow error",
            error
          );

        }

      },
      500
    );

  } catch (error) {

    console.error(
      "カート追加エラー",
      error
    );

    renderCart();

    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );

  }

}


/* ==================================================
   カート表示
================================================== */

function renderCart() {

  const cart =
    getCart();

  const list =
    document.getElementById(
      "cartList"
    );

  if (
    cart.length === 0
  ) {

    list.innerHTML =
      `
      <div
        style="
          text-align:center;
          padding:30px;
          color:#888;
        "
      >
        カートは空です
      </div>
      `;

    document.getElementById(
      "totalPrice"
    ).textContent =
      "¥0";

    document.getElementById(
      "totalTime"
    ).textContent =
      "0分";

    showPage();

    return;

  }

  list.innerHTML =
    cart.map(
      (item, index) => `

        <div class="cart-item">

          <div class="item-name">
            ${escapeHTML(
              item.name || "メニュー"
            )}
          </div>

          <div class="item-category">
            ${escapeHTML(
              item.category || ""
            )}
          </div>

          <div class="item-bottom">

            <span>
              約${Number(item.time) || 0}分
            </span>

            <span>
              ¥${(
                Number(item.price) || 0
              ).toLocaleString("ja-JP")}
            </span>

          </div>

          <button
            type="button"
            class="delete-button"
            onclick="removeItem(${index})"
          >
            削除
          </button>

        </div>

      `
    ).join("");

  let totalPrice = 0;
  let totalTime = 0;

  cart.forEach(
    item => {

      totalPrice +=
        Number(item.price) || 0;

      totalTime +=
        Number(item.time) || 0;

    }
  );

  document.getElementById(
    "totalPrice"
  ).textContent =
    "¥" +
    totalPrice.toLocaleString("ja-JP");

  document.getElementById(
    "totalTime"
  ).textContent =
    totalTime + "分";

  showPage();

}


/* ==================================================
   ページ表示
================================================== */

function showPage() {

  const container =
    document.querySelector(
      ".container"
    );

  if (container) {

    container.classList.add(
      "ready"
    );

  }

}


/* ==================================================
   削除
================================================== */

function removeItem(index) {

  const cart =
    getCart();

  cart.splice(
    index,
    1
  );

  saveCart(cart);

  renderCart();

}


/* ==================================================
   カートを空にする
================================================== */

function clearCart() {

  if (
    getCart().length === 0
  ) {
    return;
  }

  if (
    !confirm(
      "カートを空にしますか？"
    )
  ) {

    return;

  }

  localStorage.removeItem(
    CART_KEY
  );

  renderCart();

}

                type: "box",

                layout: "vertical",

                margin: "md",

                paddingAll: "18px",

                cornerRadius: "12px",

                backgroundColor: "#333333",

                contents: [

                  {

                    type: "text",

                    text:
                      "ご予約時の注意",

                    color: "#FFFFFF",

                    size: "sm",

                    weight: "bold",

                    align: "center",

                    wrap: true

                  },

                  {

                    type: "text",

                    text:
                      "【" +
                      totalTime +
                      "分】",

                    color: "#FFFFFF",

                    size: "xxl",

                    weight: "bold",

                    align: "center",

                    margin: "md",

                    wrap: true

                  },

                  {

                    type: "text",

                    text:
                      "枠を選択してください",

                    color: "#FFFFFF",

                    size: "lg",

                    weight: "bold",

                    align: "center",

                    margin: "sm",

                    wrap: true

                  }

                ]

              },


              /* ---------- 注意 ---------- */

              {

                type: "text",

                text:
                  "※まだ予約は確定していません",

                size: "sm",

                color: "#777777",

                align: "center",

                margin: "md",

                wrap: true

              }

            ]

          },


          /* ==================================
             予約ボタン
          ================================== */

          footer: {

            type: "box",

            layout: "vertical",

            spacing: "sm",

            contents: [

              {

                type: "button",

                style: "primary",

                action: {

                  type: "uri",

                  label:
                    "予約に進む",

                  uri:
                    reservationURL

                }

              }

            ]

          }

        }

      }

    ]);


    /* ==========================================
       送信成功後カート削除
    ========================================== */

    localStorage.removeItem(
      CART_KEY
    );


    /* ==========================================
       LIFFを閉じる
    ========================================== */

    setTimeout(
      () => {

        try {

          if (
            liff.isInClient()
          ) {

            liff.closeWindow();

          }

        } catch (error) {

          console.error(
            "closeWindow error",
            error
          );

        }

      },
      500
    );


  } catch (error) {

    console.error(
      "選択完了エラー",
      error
    );

    showError(
      "LINEへの送信に失敗しました。\n" +
      error.message
    );

    button.disabled = false;

    button.textContent =
      "選択完了";

  }

}


/* ==================================================
   エラー
================================================== */

function showError(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==================================================
   起動
================================================== */

async function startPage() {

  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const menuId =
      params.get("menu");

    if (menuId) {

      await addMenuFromURL(
        menuId
      );

      return;

    }

    await initLIFF();

    renderCart();

  } catch (error) {

    console.error(
      "起動エラー",
      error
    );

    showError(
      "LIFFの起動に失敗しました。\n" +
      error.message
    );

    showPage();

  }

}


/* ==================================================
   起動
================================================== */

window.addEventListener(
  "DOMContentLoaded",
  startPage
);

</script>
