<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>カートに追加</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 50px 20px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 35px 25px;
  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
  text-align: center;
}

h1 {
  font-size: 28px;
  margin: 0 0 25px;
}

.menu-name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 15px;
}

.message {
  color: #777;
  font-size: 17px;
  line-height: 1.7;
}

.button {
  display: block;
  width: 100%;
  margin-top: 30px;
  padding: 16px 20px;
  border-radius: 16px;
  border: none;
  background: #333;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #888;
  font-size: 14px;
}

</style>

</head>


<body>


<div class="container">

  <div class="card">

    <h1>
      カートに追加しました
    </h1>

    <div
      id="menuName"
      class="menu-name"
    ></div>

    <div class="message">

      このメニューをカートに追加しました。

    </div>

    <button
      class="button"
      onclick="goToMenu()"
    >
      選択したメニューを見る
    </button>

  </div>

  <div id="status"></div>

</div>


<script>

/* =========================
   カート保存場所
========================= */

const CART_KEY = "salon_cart";


/* =========================
   メニュー画面
========================= */

const MENU_URL = "./menu.html";


/* =========================
   URLからメニュー取得
========================= */

function getMenuFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const menuId =
    params.get("menu");

  const menuNames = {

    face_all:
      "顔全体",

    face_upper:
      "上顔面",

    face_lower:
      "下顔面"

  };

  const menuPrices = {

    face_all:
      5000,

    face_upper:
      3000,

    face_lower:
      3000

  };

  const menuTimes = {

    face_all:
      30,

    face_upper:
      30,

    face_lower:
      30

  };

  return {

    menu:
      menuId || "face_all",

    name:
      menuNames[menuId] || "メニュー",

    price:
      menuPrices[menuId] || 0,

    time:
      menuTimes[menuId] || 0

  };

}


/* =========================
   カート取得
========================= */

function getCart() {

  const saved =
    localStorage.getItem(
      CART_KEY
    );

  if (!saved) {

    return [];

  }

  try {

    const cart =
      JSON.parse(saved);

    if (!Array.isArray(cart)) {

      return [];

    }

    return cart;

  } catch (error) {

    console.error(
      "カート読み込みエラー：",
      error
    );

    return [];

  }

}


/* =========================
   カート保存
========================= */

function saveToCart(menu) {

  const cart =
    getCart();

  const alreadyAdded =
    cart.some(
      item =>
        item.menu === menu.menu
    );

  if (!alreadyAdded) {

    cart.push(menu);

  }

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  console.log(
    "現在のカート：",
    cart
  );

}


/* =========================
   メニューへ戻る
========================= */

function goToMenu() {

  window.location.href =
    MENU_URL;

}


/* =========================
   メイン処理
========================= */

function main() {

  const menu =
    getMenuFromURL();


  /* メニュー名表示 */

  document.getElementById(
    "menuName"
  ).textContent =
    menu.name;


  /* カートへ保存 */

  saveToCart(menu);


  console.log(
    "カート追加完了：",
    menu
  );

}


/* =========================
   起動
========================= */

window.addEventListener(
  "DOMContentLoaded",
  main
);

</script>


</body>

</html>
