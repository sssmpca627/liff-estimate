<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>カート</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>


<body>


<script>


/* =========================
   設定
========================= */


const LIFF_ID =
  "2011037691-j7UfaGxQ";


const CART_KEY =
  "salon_cart";


/*
 * 予約に進むURL
 *
 * ※ここだけ後で
 * 実際の予約URLに変更
 */

const RESERVATION_URL =
  "https://liff-estimate.vercel.app/";



/* =========================
   カート取得
========================= */

function getCart() {


  const saved =
    localStorage.getItem(
      CART_KEY
    );


  if (!saved) {

    return [];

  }


  try {

    return JSON.parse(saved);

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}



/* =========================
   金額フォーマット
========================= */

function formatPrice(price) {

  return "¥" +
    Number(price || 0)
      .toLocaleString("ja-JP");

}



/* =========================
   合計金額
========================= */

function getTotalPrice(cart) {

  return cart.reduce(

    (total, item) => {

      return total +
        Number(item.price || 0);

    },

    0

  );

}



/* =========================
   合計時間
========================= */

function getTotalTime(cart) {

  return cart.reduce(

    (total, item) => {

      return total +
        Number(item.time || 0);

    },

    0

  );

}



/* =========================
   LINE Flex Message作成
========================= */

function createFlexMessage(cart) {


  const totalPrice =
    getTotalPrice(cart);


  const totalTime =
    getTotalTime(cart);



  /*
   * メニュー一覧
   */

  const menuContents =
    cart.map(function(item) {


      return {

        type: "box",

        layout: "vertical",

        margin: "md",

        paddingAll: "16px",

        cornerRadius: "12px",

        borderWidth: "1px",

        borderColor: "#dddddd",

        contents: [

          {

            type: "text",

            text:
              item.name || "メニュー",

            weight: "bold",

            size: "lg",

            color: "#333333",

            wrap: true

          },


          {

            type: "box",

            layout: "horizontal",

            margin: "sm",

            contents: [

              {

                type: "text",

                text:
                  "約" +
                  Number(item.time || 0) +
                  "分",

                size: "sm",

                color: "#888888",

                flex: 1

              },


              {

                type: "text",

                text:
                  formatPrice(item.price),

                size: "md",

                weight: "bold",

                color: "#333333",

                align: "end"

              }

            ]

          }

        ]

      };


    });



  /*
   * Flex Message本体
   */

  return {

    type: "flex",

    altText:
      "選択したメニューはこちらです",

    contents: {

      type: "bubble",

      size: "mega",


      body: {

        type: "box",

        layout: "vertical",

        paddingAll: "20px",


        contents: [

          {

            type: "text",

            text:
              "選択したメニュー",

            weight: "bold",

            size: "xl",

            color: "#333333",

            align: "center"

          },


          {

            type: "text",

            text:
              "ご希望のメニューをご確認ください",

            size: "sm",

            color: "#888888",

            align: "center",

            margin: "sm"

          },


          {

            type: "separator",

            margin: "xl"

          },


          {

            type: "box",

            layout: "vertical",

            margin: "xl",

            spacing: "md",

            contents:
              menuContents

          },


          {

            type: "separator",

            margin: "xl"

          },


          {

            type: "box",

            layout: "horizontal",

            margin: "xl",

            contents: [

              {

                type: "text",

                text:
                  "合計金額",

                size: "md",

                color: "#666666",

                flex: 1

              },


              {

                type: "text",

                text:
                  formatPrice(totalPrice),

                size: "xl",

                weight: "bold",

                color: "#333333",

                align: "end"

              }

            ]

          },


          {

            type: "box",

            layout: "horizontal",

            margin: "md",

            contents: [

              {

                type: "text",

                text:
                  "施術時間目安",

                size: "md",

                color: "#666666",

                flex: 1

              },


              {

                type: "text",

                text:
                  totalTime + "分",

                size: "lg",

                weight: "bold",

                color: "#333333",

                align: "end"

              }

            ]

          }

        ]

      },


      footer: {

        type: "box",

        layout: "vertical",

        spacing: "sm",

        paddingAll: "20px",

        contents: [


          {

            type: "button",

            style: "secondary",

            height: "sm",

            action: {

              type: "uri",

              label:
                "メニューを追加",

              uri:
                "https://liff-estimate.vercel.app/salon-menu/menu"

            }

          },


          {

            type: "button",

            style: "primary",

            height: "sm",

            action: {

              type: "uri",

              label:
                "予約に進む",

              uri:
                RESERVATION_URL

            }

          }

        ]

      }

    }

  };

}



/* =========================
   LINEへ送信
========================= */

async function sendCartMessage() {


  const cart =
    getCart();


  /*
   * カートが空の場合
   */

  if (!cart.length) {


    await liff.sendMessages([

      {

        type: "text",

        text:
          "カートにメニューが入っていません。"

      }

    ]);


    return;

  }



  /*
   * Flex Message作成
   */

  const flexMessage =
    createFlexMessage(cart);



  /*
   * LINEへ送信
   */

  await liff.sendMessages([

    flexMessage

  ]);

}



/* =========================
   LIFFを閉じる
========================= */

function closeLIFF() {


  if (
    liff.isInClient()
  ) {

    setTimeout(

      function() {

        liff.closeWindow();

      },

      500

    );

  }

}



/* =========================
   メイン処理
========================= */

async function main() {


  try {


    /*
     * LIFF初期化
     */

    await liff.init({

      liffId:
        LIFF_ID

    });


    console.log(
      "LIFF初期化成功"
    );



    /*
     * LINEアプリ内か確認
     */

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }



    /*
     * カート内容を
     * LINEへ送信
     */

    await sendCartMessage();


    console.log(
      "カート内容送信成功"
    );



    /*
     * LIFFを閉じる
     */

    closeLIFF();


  } catch (error) {


    console.error(
      "カート送信エラー：",
      error
    );


    /*
     * エラー時は
     * LINEへテキスト送信
     */

    try {

      await liff.sendMessages([

        {

          type: "text",

          text:
            "カート情報の送信に失敗しました。"

        }

      ]);

    } catch (sendError) {

      console.error(
        "エラーメッセージ送信失敗：",
        sendError
      );

    }

  }

}



/* =========================
   起動
========================= */

window.addEventListener(

  "DOMContentLoaded",

  main

);


</script>


</body>

</html>
