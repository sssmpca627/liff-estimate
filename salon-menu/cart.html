<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>選択したメニュー</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background: #f7f7f7;

  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

}


.container {

  max-width: 700px;

  margin: 0 auto;

  padding: 40px 20px 60px;

}


.card {

  background: #fff;

  border-radius: 24px;

  padding: 30px 20px;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);

}


h1 {

  text-align: center;

  font-size: 28px;

  margin: 0 0 10px;

}


.subtitle {

  text-align: center;

  color: #888;

  font-size: 15px;

  margin-bottom: 28px;

}


.cart-item {

  border: 1px solid #e3e3e3;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 12px;

  background: #fff;

}


.item-top {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 12px;

}


.item-name {

  font-size: 19px;

  font-weight: 700;

  line-height: 1.5;

}


.delete-button {

  border: none;

  background: transparent;

  color: #aaa;

  font-size: 15px;

  padding: 3px 0;

}


.item-bottom {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 12px;

}


.item-time {

  color: #888;

  font-size: 16px;

}


.item-price {

  font-size: 19px;

  font-weight: 700;

}


.total {

  border-top: 1px solid #ddd;

  margin-top: 24px;

  padding-top: 22px;

}


.total-row {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 16px;

}


.total-label {

  font-size: 17px;

  color: #666;

}


.total-price {

  font-size: 28px;

  font-weight: 700;

}


.total-time {

  font-size: 24px;

  font-weight: 700;

}


.button-area {

  margin-top: 28px;

}


.button {

  width: 100%;

  border-radius: 15px;

  padding: 17px 20px;

  font-size: 18px;

  font-weight: 700;

  cursor: pointer;

}


.add-button {

  background: #fff;

  border: 1px solid #ccc;

  color: #333;

  margin-bottom: 12px;

}


.reserve-button {

  background: #333;

  border: 1px solid #333;

  color: #fff;

}


.clear-button {

  display: block;

  margin: 22px auto 0;

  border: none;

  background: transparent;

  color: #aaa;

  font-size: 15px;

}


.empty {

  text-align: center;

  padding: 35px 10px;

}


.empty-title {

  font-size: 21px;

  font-weight: 700;

  margin-bottom: 12px;

}


.empty-message {

  color: #888;

  font-size: 15px;

  line-height: 1.7;

}


#status {

  text-align: center;

  color: #888;

  font-size: 14px;

  margin-top: 18px;

}


.sending {

  opacity: 0.6;

  pointer-events: none;

}

</style>

</head>


<body>


<div class="container">


  <div class="card">


    <h1>
      選択したメニュー
    </h1>


    <div class="subtitle">
      ご希望のメニューをご確認ください
    </div>


    <div id="cartList"></div>


    <div
      id="totalArea"
      class="total"
      style="display:none;"
    >

      <div class="total-row">

        <div class="total-label">
          合計金額
        </div>

        <div
          id="totalPrice"
          class="total-price"
        >
          ¥0
        </div>

      </div>


      <div class="total-row">

        <div class="total-label">
          施術時間目安
        </div>

        <div
          id="totalTime"
          class="total-time"
        >
          0分
        </div>

      </div>

    </div>


    <div
      id="buttonArea"
      class="button-area"
      style="display:none;"
    >

      <button
        id="addButton"
        class="button add-button"
        onclick="addMenu()"
      >
        メニューを追加
      </button>


      <button
        id="completeButton"
        class="button reserve-button"
        onclick="completeSelection()"
      >
        選択完了
      </button>


      <button
        class="clear-button"
        onclick="clearCart()"
      >
        カートを空にする
      </button>

    </div>

  </div>


  <div id="status"></div>


</div>



<script>


/* =========================
   LIFF設定
========================= */

const LIFF_ID =
  "2011037691-j7UfaGxQ";


/* =========================
   カート保存場所
========================= */

const CART_KEY =
  "salon_cart";


/* =========================
   メニュー画面
========================= */

const MENU_URL =
  "./menu.html";


/* =========================
   LIFF状態
========================= */

let liffInitialized = false;


/* =========================
   LIFF初期化
========================= */

async function initializeLIFF() {

  try {

    await liff.init({

      liffId: LIFF_ID,

      withLoginOnExternalBrowser: false

    });

    liffInitialized = true;

    console.log(
      "LIFF初期化成功"
    );

  } catch (error) {

    console.error(
      "LIFF初期化エラー：",
      error
    );

  }

}


/* =========================
   カート取得
========================= */

function getCart() {

  const saved =
    localStorage.getItem(
      CART_KEY
    );

  if (!saved) {

    return [];

  }

  try {

    const cart =
      JSON.parse(saved);

    if (!Array.isArray(cart)) {

      return [];

    }

    return cart;

  } catch (error) {

    console.error(
      "カート読み込みエラー：",
      error
    );

    return [];

  }

}


/* =========================
   カート保存
========================= */

function saveCart(cart) {

  localStorage.setItem(

    CART_KEY,

    JSON.stringify(cart)

  );

}


/* =========================
   金額表示
========================= */

function formatPrice(price) {

  const number =
    Number(price) || 0;

  return (
    "¥" +
    number.toLocaleString("ja-JP")
  );

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   カート表示
========================= */

function renderCart() {

  const cart =
    getCart();


  const cartList =
    document.getElementById(
      "cartList"
    );


  const totalArea =
    document.getElementById(
      "totalArea"
    );


  const buttonArea =
    document.getElementById(
      "buttonArea"
    );


  /* カートが空 */

  if (cart.length === 0) {

    cartList.innerHTML = `

      <div class="empty">

        <div class="empty-title">
          カートは空です
        </div>

        <div class="empty-message">

          メニューを選択して<br>
          カートに追加してください。

        </div>

      </div>

    `;


    totalArea.style.display =
      "none";


    buttonArea.style.display =
      "none";


    return;

  }


  /* カート項目 */

  cartList.innerHTML =

    cart.map(
      (item, index) => `

        <div class="cart-item">

          <div class="item-top">

            <div class="item-name">

              ${escapeHTML(
                item.name || "メニュー"
              )}

            </div>


            <button

              class="delete-button"

              onclick="
                removeItem(${index})
              "

            >

              削除

            </button>

          </div>


          <div class="item-bottom">

            <div class="item-time">

              約${Number(item.time) || 0}分

            </div>


            <div class="item-price">

              ${formatPrice(item.price)}

            </div>

          </div>

        </div>

      `
    ).join("");


  /* 合計 */

  let totalPrice = 0;

  let totalTime = 0;


  cart.forEach(
    item => {

      totalPrice +=
        Number(item.price) || 0;

      totalTime +=
        Number(item.time) || 0;

    }
  );


  document.getElementById(
    "totalPrice"
  ).textContent =
    formatPrice(totalPrice);


  document.getElementById(
    "totalTime"
  ).textContent =
    totalTime + "分";


  totalArea.style.display =
    "block";


  buttonArea.style.display =
    "block";

}


/* =========================
   メニュー削除
========================= */

function removeItem(index) {

  const cart =
    getCart();


  cart.splice(index, 1);


  saveCart(cart);


  renderCart();

}


/* =========================
   カートを空にする
========================= */

function clearCart() {

  const cart =
    getCart();


  if (cart.length === 0) {

    return;

  }


  if (
    !confirm(
      "カートを空にしますか？"
    )
  ) {

    return;

  }


  localStorage.removeItem(
    CART_KEY
  );


  renderCart();

}


/* =========================
   メニュー追加
========================= */

function addMenu() {

  window.location.href =
    MENU_URL;

}


/* =========================
   LINE送信用メッセージ
========================= */

function createLineMessage() {

  const cart =
    getCart();


  if (cart.length === 0) {

    return "";

  }


  let totalPrice = 0;

  let totalTime = 0;


  let message =
    "【選択したメニュー】\n\n";


  cart.forEach(
    item => {

      const name =
        item.name || "メニュー";


      const price =
        Number(item.price) || 0;


      const time =
        Number(item.time) || 0;


      message +=
        "・" +
        name +
        "：" +
        formatPrice(price) +
        "｜約" +
        time +
        "分\n";


      totalPrice += price;

      totalTime += time;

    }
  );


  message +=
    "\n合計金額：" +
    formatPrice(totalPrice);


  message +=
    "\n施術時間目安：約" +
    totalTime +
    "分";


  return message;

}


/* =========================
   選択完了
========================= */

async function completeSelection() {

  const cart =
    getCart();


  if (cart.length === 0) {

    alert(
      "メニューを選択してください。"
    );

    return;

  }


  const button =
    document.getElementById(
      "completeButton"
    );


  const status =
    document.getElementById(
      "status"
    );


  button.disabled =
    true;


  button.classList.add(
    "sending"
  );


  button.textContent =
    "送信中…";


  status.textContent =
    "選択したメニューを送信しています…";


  try {


    /* LIFF初期化 */

    if (!liffInitialized) {

      throw new Error(
        "LIFFの初期化が完了していません。"
      );

    }


    /* LINEアプリ内確認 */

    if (!liff.isInClient()) {

      throw new Error(
        "LINEアプリ内から操作してください。"
      );

    }


    /* sendMessages確認 */

    if (
      !liff.isApiAvailable(
        "sendMessages"
      )
    ) {

      throw new Error(
        "LINEメッセージ送信機能が利用できません。LIFFの「chat_message.write」を確認してください。"
      );

    }


    /* メッセージ作成 */

    const message =
      createLineMessage();


    console.log(
      "送信メッセージ：",
      message
    );


    /* LINEへ送信 */

    await liff.sendMessages([

      {

        type: "text",

        text: message

      }

    ]);


    console.log(
      "LINE送信成功"
    );


    status.textContent =
      "送信しました。";


    /* 送信成功後にカート削除 */

    localStorage.removeItem(
      CART_KEY
    );


    /* LIFFを閉じる */

    setTimeout(
      function() {

        liff.closeWindow();

      },
      500
    );


  } catch (error) {

    console.error(
      "LINE送信エラー：",
      error
    );


    button.disabled =
      false;


    button.classList.remove(
      "sending"
    );


    button.textContent =
      "選択完了";


    status.textContent =
      "";


    alert(
      "LINEへの送信に失敗しました。\n\n" +
      error.message
    );

  }

}


/* =========================
   ページ起動
========================= */

window.addEventListener(

  "DOMContentLoaded",

  async function() {

    /*

     * 先にカートを表示
     */

    renderCart();


    /*

     * LIFF初期化
     */

    await initializeLIFF();

  }

);

</script>


</body>

</html>
