<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>カート</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 50px 20px;
}

.card {

  background: #fff;

  border-radius: 24px;

  padding: 35px 25px;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);

  text-align: center;
}

h1 {

  font-size: 28px;

  margin:
    0 0 25px;

}

.menu-name {

  font-size: 22px;

  font-weight: 700;

  margin-bottom: 15px;

}

.message {

  color: #777;

  font-size: 17px;

  margin-bottom: 30px;

}

#status {

  margin-top: 20px;

  text-align: center;

  color: #777;

  font-size: 14px;

}

</style>

</head>


<body>


<div class="container">


  <div class="card">


    <h1>
      カートに追加しました
    </h1>


    <div
      id="menuName"
      class="menu-name"
    ></div>


    <div class="message">

      このメニューを
      カートに追加しました。

    </div>


  </div>


  <div id="status"></div>


</div>



<script>


/* =========================
   設定
========================= */


const LIFF_ID =
  "2011037691-j7UfaGxQ";


const CART_KEY =
  "salon_cart";



/* =========================
   メニュー情報
========================= */

const MENU_DATA = {

  face_all: {

    name: "顔全体",

    price: 5000,

    time: 30

  },


  face_upper: {

    name: "上顔面/鼻上",

    price: 3000,

    time: 30

  },


  face_lower: {

    name: "下顔面/鼻下",

    price: 3000,

    time: 30

  }

};



/* =========================
   URLからメニュー取得
========================= */

function getMenuFromURL() {


  const params =
    new URLSearchParams(
      window.location.search
    );


  const menuId =
    params.get("menu");


  /*
   * menu IDから
   * 正しいメニュー情報を取得
   */


  const menu =
    MENU_DATA[menuId];


  if (menu) {


    return {

      menu: menuId,

      name: menu.name,

      price: menu.price,

      time: menu.time

    };


  }


  /*
   * 万が一
   * 未登録のmenu IDだった場合
   */


  return {

    menu:
      menuId || "unknown",

    name:
      params.get("name") || "選択したメニュー",

    price:
      Number(
        params.get("price") || 0
      ),

    time:
      Number(
        params.get("time") || 0
      )

  };

}



/* =========================
   カート取得
========================= */

function getCart() {


  const saved =
    localStorage.getItem(
      CART_KEY
    );


  if (!saved) {

    return [];

  }


  try {

    return JSON.parse(saved);

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}



/* =========================
   カート保存
========================= */

function saveToCart(menu) {


  const cart =
    getCart();


  /*
   * 同じメニューは
   * 二重追加しない
   */


  const alreadyAdded =
    cart.some(
      item =>
        item.menu === menu.menu
    );


  if (!alreadyAdded) {

    cart.push(menu);

  }


  localStorage.setItem(

    CART_KEY,

    JSON.stringify(cart)

  );


  console.log(
    "現在のカート：",
    cart
  );

}



/* =========================
   LINEへ送信
========================= */

async function sendCartAddedMessage() {


  await liff.sendMessages([

    {

      type: "text",

      text:
        "【カートに追加しました】"

    }

  ]);

}



/* =========================
   LIFFを閉じる
========================= */

function closeLIFF() {


  if (!liff.isInClient()) {

    console.log(
      "LIFF内ではありません"
    );

    return;

  }


  console.log(
    "LIFFを閉じます"
  );


  setTimeout(function() {

    liff.closeWindow();

  }, 500);

}



/* =========================
   メイン処理
========================= */

async function main() {


  try {


    /*
     * LIFF初期化
     */

    await liff.init({

      liffId:
        LIFF_ID

    });


    console.log(
      "LIFF初期化成功"
    );



    /*
     * LIFF初期化後に
     * URLからメニュー取得
     */

    const menu =
      getMenuFromURL();



    /*
     * メニュー名表示
     */

    document
      .getElementById("menuName")
      .textContent =
      menu.name;



    /*
     * カートへ保存
     */

    saveToCart(menu);


    console.log(
      "カート保存成功",
      menu
    );



    /*
     * LINEへ送信
     */

    try {


      await sendCartAddedMessage();


      console.log(
        "LINE送信成功"
      );


    } catch (error) {


      console.error(
        "LINE送信エラー：",
        error
      );


    }



    /*
     * LIFFを閉じる
     */

    closeLIFF();


  } catch (error) {


    console.error(
      "エラー：",
      error
    );


    document
      .getElementById("status")
      .textContent =
      "エラー：" +
      error.message;

  }

}



/* =========================
   起動
========================= */

window.addEventListener(

  "DOMContentLoaded",

  main

);


</script>


</body>
</html>
