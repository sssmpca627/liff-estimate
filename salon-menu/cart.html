<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>予約枠を選択する</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 30px 20px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 28px 20px 30px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

.close {
  text-align: right;
  font-size: 28px;
  color: #999;
  line-height: 1;
  cursor: pointer;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 12px 0 28px;
}

.label {
  text-align: center;
  color: #888;
  font-size: 14px;
}

.time {
  text-align: center;
  font-size: 38px;
  font-weight: 700;
  margin: 8px 0 20px;
}

.description {
  text-align: center;
  color: #777;
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 30px;
}

.reserve-button {
  display: block;
  width: 100%;
  padding: 17px 10px;
  border-radius: 16px;
  background: #333;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 17px;
  font-weight: 700;
}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <div
      class="close"
      onclick="closePage()"
    >
      ×
    </div>

    <h1>
      予約枠を選択する
    </h1>

    <div class="label">
      施術時間目安
    </div>

    <div
      id="time"
      class="time"
    >
      読み込み中...
    </div>

    <div class="description">
      今回の施術時間に合わせて<br>
      予約枠をお選びください。
    </div>

    <a
      id="reserveButton"
      class="reserve-button"
      href="#"
    >
      予約日時を選択する
    </a>

  </div>

</div>


<script>

/* ==================================================
   設定
================================================== */

const CART_KEY =
  "salon_cart";


/* ==================================================
   既存の予約フォームURL
   ※ここは変更しない
================================================== */

const RESERVATION_FORM_URL =
  "https://liff.line.me/2011037691-bVtPC8Uc?liff_id=2011037691-bVtPC8Uc&is=zH9OY9ZgDL";


/* ==================================================
   カート取得
================================================== */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);

  if (!saved) {
    return [];
  }

  try {

    const cart =
      JSON.parse(saved);

    if (!Array.isArray(cart)) {
      return [];
    }

    return cart;

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* ==================================================
   合計施術時間
================================================== */

function getTotalTime() {

  const cart =
    getCart();

  let totalTime = 0;

  cart.forEach(item => {

    const time =
      Number(item.time);

    if (
      Number.isFinite(time)
    ) {

      totalTime += time;

    }

  });

  return totalTime;

}


/* ==================================================
   初期表示
================================================== */

function init() {

  const totalTime =
    getTotalTime();


  console.log(
    "予約枠ページのカート：",
    getCart()
  );

  console.log(
    "合計施術時間：",
    totalTime
  );


  document.getElementById(
    "time"
  ).textContent =
    totalTime + "分";


  const button =
    document.getElementById(
      "reserveButton"
    );


  button.href =
    RESERVATION_FORM_URL;

}


/* ==================================================
   閉じる
================================================== */

function closePage() {

  if (
    window.history.length > 1
  ) {

    window.history.back();

    return;

  }


  try {

    window.close();

  } catch (error) {

    console.error(
      "close error",
      error
    );

  }

}


/* ==================================================
   起動
================================================== */

document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>

</body>

</html>
