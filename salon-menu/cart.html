<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>カート</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>


<body>


<script>


/* =========================
   設定
========================= */

const LIFF_ID =
  "2011037691-j7UfaGxQ";


const CART_KEY =
  "salon_cart";


/*
 * 予約に進むURL
 *
 * 今は仮URL
 * 後から変更可能
 */

const RESERVATION_URL =
  "https://liff-estimate.vercel.app/";


/*
 * メニュー追加URL
 */

const MENU_URL =
  "https://liff-estimate.vercel.app/salon-menu/menu";



/* =========================
   カート取得
========================= */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);


  if (!saved) {

    return [];

  }


  try {

    const cart =
      JSON.parse(saved);


    if (!Array.isArray(cart)) {

      return [];

    }


    return cart;

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );


    return [];

  }

}



/* =========================
   金額フォーマット
========================= */

function formatPrice(price) {

  return (
    "¥" +
    Number(price || 0)
      .toLocaleString("ja-JP")
  );

}



/* =========================
   合計金額
========================= */

function getTotalPrice(cart) {

  return cart.reduce(

    function(total, item) {

      return (
        total +
        Number(item.price || 0)
      );

    },

    0

  );

}



/* =========================
   合計施術時間
========================= */

function getTotalTime(cart) {

  return cart.reduce(

    function(total, item) {

      return (
        total +
        Number(item.time || 0)
      );

    },

    0

  );

}



/* =========================
   メニュー表示部分
========================= */

function createMenuContents(cart) {


  return cart.map(

    function(item) {


      return {

        type: "box",

        layout: "vertical",

        margin: "md",

        paddingAll: "15px",

        cornerRadius: "12px",

        borderWidth: "1px",

        borderColor: "#dddddd",


        contents: [

          {

            type: "text",

            text:
              item.name ||
              "選択したメニュー",

            weight: "bold",

            size: "lg",

            color: "#333333",

            wrap: true

          },


          {

            type: "box",

            layout: "horizontal",

            margin: "sm",


            contents: [

              {

                type: "text",

                text:
                  "約" +
                  Number(item.time || 0) +
                  "分",

                size: "sm",

                color: "#888888",

                flex: 1

              },


              {

                type: "text",

                text:
                  formatPrice(item.price),

                size: "md",

                weight: "bold",

                color: "#333333",

                align: "end"

              }

            ]

          }

        ]

      };


    }

  );

}



/* =========================
   Flex Message作成
========================= */

function createFlexMessage(cart) {


  const totalPrice =
    getTotalPrice(cart);


  const totalTime =
    getTotalTime(cart);


  const menuContents =
    createMenuContents(cart);



  return {

    type: "flex",

    altText:
      "選択したメニューはこちらです",


    contents: {

      type: "bubble",

      size: "mega",


      body: {

        type: "box",

        layout: "vertical",

        paddingAll: "20px",


        contents: [

          {

            type: "text",

            text:
              "選択したメニュー",

            weight: "bold",

            size: "xl",

            color: "#333333",

            align: "center"

          },


          {

            type: "text",

            text:
              "ご希望のメニューをご確認ください",

            size: "sm",

            color: "#888888",

            align: "center",

            margin: "sm"

          },


          {

            type: "separator",

            margin: "xl"

          },


          {

            type: "box",

            layout: "vertical",

            margin: "xl",

            spacing: "md",

            contents:
              menuContents

          },


          {

            type: "separator",

            margin: "xl"

          },


          {

            type: "box",

            layout: "horizontal",

            margin: "xl",


            contents: [

              {

                type: "text",

                text:
                  "合計金額",

                size: "md",

                color: "#666666",

                flex: 1

              },


              {

                type: "text",

                text:
                  formatPrice(totalPrice),

                size: "xl",

                weight: "bold",

                color: "#333333",

                align: "end"

              }

            ]

          },


          {

            type: "box",

            layout: "horizontal",

            margin: "md",


            contents: [

              {

                type: "text",

                text:
                  "施術時間目安",

                size: "md",

                color: "#666666",

                flex: 1

              },


              {

                type: "text",

                text:
                  totalTime + "分",

                size: "lg",

                weight: "bold",

                color: "#333333",

                align: "end"

              }

            ]

          }

        ]

      },


      /* =========================
         ボタン
      ========================= */

      footer: {

        type: "box",

        layout: "vertical",

        spacing: "sm",

        paddingAll: "20px",


        contents: [

          {

            type: "button",

            style: "secondary",

            height: "sm",


            action: {

              type: "uri",

              label:
                "メニューを追加",

              uri:
                MENU_URL

            }

          },


          {

            type: "button",

            style: "primary",

            height: "sm",


            action: {

              type: "uri",

              label:
                "予約に進む",

              uri:
                RESERVATION_URL

            }

          }

        ]

      }

    }

  };

}



/* =========================
   カートをLINEへ送信
========================= */

async function sendCartMessage() {


  const cart =
    getCart();


  console.log(
    "現在のカート：",
    cart
  );


  /*
   * カートが空の場合
   */

  if (!cart.length) {


    await liff.sendMessages([

      {

        type: "text",

        text:
          "カートにメニューが入っていません。"

      }

    ]);


    return;

  }



  /*
   * Flex Message作成
   */

  const flexMessage =
    createFlexMessage(cart);



  console.log(
    "送信するFlex Message：",
    flexMessage
  );



  /*
   * LINEへ送信
   */

  await liff.sendMessages([

    flexMessage

  ]);

}



/* =========================
   LIFFを閉じる
========================= */

function closeLIFF() {


  if (
    liff.isInClient()
  ) {


    console.log(
      "LIFFを閉じます"
    );


    setTimeout(

      function() {

        liff.closeWindow();

      },

      500

    );

  }

}



/* =========================
   メイン処理
========================= */

async function main() {


  try {


    console.log(
      "LIFF初期化開始"
    );


    /*
     * LIFF初期化
     */

    await liff.init({

      liffId:
        LIFF_ID

    });


    console.log(
      "LIFF初期化成功"
    );



    /*
     * LINEアプリ内か確認
     */

    if (
      !liff.isInClient()
    ) {


      console.log(
        "LINEアプリ内ではありません"
      );


      return;

    }



    /*
     * カート内容を
     * LINEへ送信
     */

    await sendCartMessage();


    console.log(
      "カート内容送信成功"
    );



    /*
     * LIFFを閉じる
     */

    closeLIFF();


  } catch (error) {


    console.error(
      "カート送信エラー：",
      error
    );


  }

}



/* =========================
   ページ読み込み
========================= */

window.addEventListener(

  "DOMContentLoaded",

  main

);


</script>


</body>

</html>
