<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予約ページ</title>
</head>

<body>

<div id="app"></div>

<script>

const CART_KEY = "salon_cart";

function getCart() {

  const saved = localStorage.getItem(CART_KEY);

  if (!saved) {
    return [];
  }

  try {
    const cart = JSON.parse(saved);
    return Array.isArray(cart) ? cart : [];
  } catch (e) {
    return [];
  }

}

const cart = getCart();

let totalTime = 0;

cart.forEach(item => {
  totalTime += Number(item.time) || 0;
});

document.getElementById("app").innerHTML = `
  <div style="
    max-width:700px;
    margin:0 auto;
    padding:40px 20px;
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    text-align:center;
  ">

    <h1>ご予約について</h1>

    <div style="
      margin-top:30px;
      padding:30px 20px;
      background:#f7f7f7;
      border-radius:20px;
    ">

      <h2>【ご予約時の注意】</h2>

      <p style="
        font-size:24px;
        font-weight:bold;
      ">
        【${totalTime}分】枠を選択してください
      </p>

      <p>
        ※まだ予約は確定していません
      </p>

    </div>

  </div>
`;

</script>

</body>
</html>
