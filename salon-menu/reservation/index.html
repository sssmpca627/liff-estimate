<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>予約枠を選択する</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 28px 20px;
  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 0 0 12px;
}

.message {
  text-align: center;
  color: #666;
  font-size: 15px;
  line-height: 1.8;
  margin-bottom: 25px;
}

.time-box {
  border: 1px solid #e3e3e3;
  border-radius: 18px;
  padding: 22px 15px;
  text-align: center;
  margin-bottom: 22px;
}

.time-label {
  color: #777;
  font-size: 15px;
  margin-bottom: 8px;
}

.time-value {
  font-size: 30px;
  font-weight: 700;
}

.reserve-button {
  display: block;
  width: 100%;
  padding: 17px;

  border-radius: 16px;

  background: #333;
  color: #fff;

  font-size: 17px;
  font-weight: 700;

  text-align: center;
  text-decoration: none;
}

.error {
  display: none;

  margin-top: 18px;

  text-align: center;

  color: #999;

  font-size: 14px;

  line-height: 1.7;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<h1>
予約枠を選択する
</h1>


<div class="message">
今回の施術時間に合わせて<br>
予約枠をお選びください。
</div>


<div class="time-box">

<div class="time-label">
施術時間目安
</div>

<div
  id="time"
  class="time-value"
>
0分
</div>

</div>


<a
  id="reserveButton"
  class="reserve-button"
  href="https://liff.line.me/2011037691-bVtPC8Uc?liff_id=2011037691-bVtPC8Uc&is=zH9OY9ZgDL"
>
予約日時を選択する
</a>


<div
  id="error"
  class="error"
>
施術時間が指定されていません。
</div>

</div>

</div>


<script>

/* ==================================================
   URLから施術時間を取得
================================================== */

function getTimeFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const time =
    Number(
      params.get("time")
    );


  if (
    Number.isFinite(time) &&
    time > 0
  ) {

    return time;

  }


  return 0;

}


/* ==================================================
   表示
================================================== */

function showTime() {

  const time =
    getTimeFromURL();


  const timeElement =
    document.getElementById(
      "time"
    );


  const errorElement =
    document.getElementById(
      "error"
    );


  if (
    time > 0
  ) {

    timeElement.textContent =
      time + "分";

    errorElement.style.display =
      "none";

  } else {

    timeElement.textContent =
      "0分";

    errorElement.style.display =
      "block";

  }

}


/* ==================================================
   起動
================================================== */

window.addEventListener(
  "DOMContentLoaded",
  showTime
);

</script>

</body>

</html>
