<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>予約枠を選択する</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 28px 20px;
  box-shadow:
    0 3px 12px rgba(0,0,0,0.06);
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 0 0 12px;
}

.message {
  text-align: center;
  color: #666;
  font-size: 16px;
  line-height: 1.8;
  margin-bottom: 25px;
}

.time-box {
  border: 1px solid #ddd;
  border-radius: 18px;
  padding: 22px 15px;
  text-align: center;
  margin-bottom: 22px;
}

.time-label {
  color: #777;
  font-size: 15px;
  margin-bottom: 8px;
}

.time-value {
  font-size: 30px;
  font-weight: 700;
}

.button {
  display: block;
  width: 100%;
  border-radius: 16px;
  padding: 17px;
  font-size: 17px;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

.reserve-button {
  background: #333;
  border: 1px solid #333;
  color: #fff;
}

.empty-message {
  text-align: center;
  color: #888;
  line-height: 1.8;
  padding: 20px 5px;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<h1>
予約枠を選択する
</h1>


<div class="message">
今回の施術時間に合わせて<br>
予約枠をお選びください。
</div>


<div class="time-box">

<div class="time-label">
施術時間目安
</div>


<div
  id="totalTime"
  class="time-value"
>
読み込み中…
</div>

</div>


<a
  id="reserveButton"
  class="button reserve-button"
  href="#"
>
予約日時を選択する
</a>


<div
  id="emptyMessage"
  class="empty-message"
  style="display:none;"
>
選択したメニューを取得できませんでした。
<br>
先にメニューを選択してください。
</div>


</div>

</div>


<script>

/* ==================================================
   設定
================================================== */


/*
 * 今のカートと同じ保存場所
 */
const CART_KEY =
  "salon_cart";


/*
 * 予約フォームURL
 */
const RESERVATION_URL =
  "https://liff.line.me/2011037691-bVtPC8Uc?liff_id=2011037691-bVtPC8Uc&is=zH9OY9ZgDL";


/* ==================================================
   カート取得
================================================== */

function getCart() {

  const saved =
    localStorage.getItem(CART_KEY);


  if (!saved) {

    return [];

  }


  try {

    const cart =
      JSON.parse(saved);


    if (
      Array.isArray(cart)
    ) {

      return cart;

    }


    return [];

  } catch (error) {

    console.error(
      "カート読み込みエラー",
      error
    );

    return [];

  }

}


/* ==================================================
   合計施術時間
================================================== */

function getTotalTime() {

  const cart =
    getCart();


  let totalTime = 0;


  cart.forEach(
    item => {

      const time =
        Number(item.time);


      if (
        Number.isFinite(time)
      ) {

        totalTime += time;

      }

    }
  );


  return totalTime;

}


/* ==================================================
   画面表示
================================================== */

function renderPage() {

  const totalTime =
    getTotalTime();


  const timeElement =
    document.getElementById(
      "totalTime"
    );


  const button =
    document.getElementById(
      "reserveButton"
    );


  const emptyMessage =
    document.getElementById(
      "emptyMessage"
    );


  /*
   * メニューがある場合
   */

  if (
    totalTime > 0
  ) {

    timeElement.textContent =
      totalTime + "分";


    button.href =
      RESERVATION_URL;


    button.style.display =
      "block";


    emptyMessage.style.display =
      "none";


    return;

  }


  /*
   * メニューがない場合
   */

  timeElement.textContent =
    "0分";


  button.style.display =
    "none";


  emptyMessage.style.display =
    "block";

}


/* ==================================================
   起動
================================================== */

window.addEventListener(
  "DOMContentLoaded",
  function() {

    renderPage();

  }
);

</script>

</body>

</html>
