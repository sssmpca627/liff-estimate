<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>予約枠を選択する</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 30px 20px 50px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 30px 22px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

.close {
  text-align: right;
  font-size: 28px;
  color: #999;
  cursor: pointer;
  line-height: 1;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 10px 0 25px;
}

.title {
  text-align: center;
  font-size: 15px;
  color: #777;
  margin-bottom: 8px;
}

.time {
  text-align: center;
  font-size: 38px;
  font-weight: 700;
  margin: 5px 0 20px;
}

.description {
  text-align: center;
  font-size: 14px;
  color: #777;
  line-height: 1.8;
  margin-bottom: 30px;
}

.reserve-button {
  display: block;
  width: 100%;
  padding: 17px 10px;
  border-radius: 16px;
  background: #333;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 17px;
  font-weight: 700;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<div
  class="close"
  onclick="closePage()"
>
×
</div>


<h1>
予約枠を選択する
</h1>


<div class="title">
施術時間目安
</div>


<div
  id="time"
  class="time"
>
読み込み中...
</div>


<div class="description">
今回の施術時間に合わせて<br>
予約枠をお選びください。
</div>


<a
  id="reserveButton"
  class="reserve-button"
  href="#"
>
予約日時を選択する
</a>


</div>

</div>


<script>

/* ==================================================
   元の予約フォームURL
   ※ここには time を付けない
================================================== */

const RESERVATION_FORM_URL =
  "https://liff.line.me/2011037691-bVtPC8Uc?liff_id=2011037691-bVtPC8Uc&is=zH9OY9ZgDL";


/* ==================================================
   URLから施術時間を取得
================================================== */

function getTreatmentTime() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const time =
    params.get("time");


  if (!time) {

    return 0;

  }


  const number =
    Number(time);


  if (
    !Number.isFinite(number) ||
    number < 0
  ) {

    return 0;

  }


  return Math.round(number);

}


/* ==================================================
   表示
================================================== */

function displayTime() {

  const time =
    getTreatmentTime();


  document.getElementById(
    "time"
  ).textContent =
    time + "分";


  document.getElementById(
    "reserveButton"
  ).href =
    RESERVATION_FORM_URL;

}


/* ==================================================
   閉じる
================================================== */

function closePage() {

  window.history.back();

}


/* ==================================================
   起動
================================================== */

document.addEventListener(
  "DOMContentLoaded",
  displayTime
);

</script>

</body>

</html>
