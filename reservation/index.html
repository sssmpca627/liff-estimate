<script>

const RESERVATION_FORM_URL =
  "https://liff.line.me/2011037691-bVtPC8Uc?liff_id=2011037691-bVtPC8Uc&is=zH9OY9ZgDL";


function getTreatmentTime() {

  /*
   * ① URLから取得
   *
   * ?time=90
   */

  const params =
    new URLSearchParams(
      window.location.search
    );

  let value =
    params.get("time");


  let time =
    Number(value);


  /*
   * ② URLにない場合
   * localStorageから取得
   */

  if (
    !Number.isFinite(time) ||
    time <= 0
  ) {

    time =
      Number(
        localStorage.getItem(
          "salon_total_time"
        )
      );

  }


  /*
   * ③ それでも取得できない場合
   */

  if (
    !Number.isFinite(time) ||
    time <= 0
  ) {

    return 0;

  }


  return Math.round(time);

}


function init() {

  const time =
    getTreatmentTime();


  document.getElementById(
    "time"
  ).textContent =
    time + "分";


  document.getElementById(
    "reserveButton"
  ).href =
    RESERVATION_FORM_URL;

}


function closePage() {

  if (
    window.history.length > 1
  ) {

    window.history.back();

    return;

  }


  try {

    window.close();

  } catch (error) {

    console.error(
      "close error",
      error
    );

  }

}


document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>
