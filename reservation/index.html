<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>予約枠を選択する</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 30px 20px;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 28px 20px 30px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

.close {
  text-align: right;
  font-size: 28px;
  color: #999;
  line-height: 1;
  cursor: pointer;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 12px 0 28px;
}

.label {
  text-align: center;
  color: #888;
  font-size: 14px;
}

.time {
  text-align: center;
  font-size: 38px;
  font-weight: 700;
  margin: 8px 0 20px;
}

.description {
  text-align: center;
  color: #777;
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 30px;
}

.reserve-button {
  display: block;
  width: 100%;
  padding: 17px 10px;
  border-radius: 16px;
  background: #333;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 17px;
  font-weight: 700;
}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <div
      class="close"
      onclick="closePage()"
    >
      ×
    </div>

    <h1>
      予約枠を選択する
    </h1>

    <div class="label">
      施術時間目安
    </div>

    <div
      id="time"
      class="time"
    >
      読み込み中...
    </div>

    <div class="description">
      今回の施術時間に合わせて<br>
      予約枠をお選びください。
    </div>

    <a
      id="reserveButton"
      class="reserve-button"
      href="#"
    >
      予約日時を選択する
    </a>

  </div>

</div>


<script>

/* ==================================================
   設定
================================================== */

const RESERVATION_FORM_URL =
  "https://liff.line.me/2011037691-bVtPC8Uc?liff_id=2011037691-bVtPC8Uc&is=zH9OY9ZgDL";


const CART_KEY =
  "salon_cart";


const TOTAL_TIME_KEY =
  "salon_total_time";


/* ==================================================
   数値変換
================================================== */

function toNumber(value) {

  const number =
    Number(value);

  if (
    Number.isFinite(number)
  ) {

    return number;

  }

  return 0;

}


/* ==================================================
   カートから合計時間を取得
================================================== */

function getTimeFromCart() {

  const saved =
    localStorage.getItem(
      CART_KEY
    );


  if (!saved) {

    return 0;

  }


  try {

    const cart =
      JSON.parse(saved);


    if (
      !Array.isArray(cart)
    ) {

      return 0;

    }


    let totalTime = 0;


    cart.forEach(
      item => {

        totalTime +=
          toNumber(item.time);

      }
    );


    return Math.round(
      totalTime
    );


  } catch (error) {

    console.error(
      "カート時間取得エラー",
      error
    );


    return 0;

  }

}


/* ==================================================
   保存されている合計時間を取得
================================================== */

function getSavedTotalTime() {

  const value =
    localStorage.getItem(
      TOTAL_TIME_KEY
    );


  const time =
    toNumber(value);


  if (
    time > 0
  ) {

    return Math.round(
      time
    );

  }


  return 0;

}


/* ==================================================
   URLから時間を取得
================================================== */

function getURLTime() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const value =
    params.get("time");


  const time =
    toNumber(value);


  if (
    time > 0
  ) {

    return Math.round(
      time
    );

  }


  return 0;

}


/* ==================================================
   施術時間取得
================================================== */

function getTreatmentTime() {

  /*
   * 優先順位
   *
   * ① salon_cart
   * ② salon_total_time
   * ③ URL ?time=
   */


  const cartTime =
    getTimeFromCart();


  if (
    cartTime > 0
  ) {

    return cartTime;

  }


  const savedTime =
    getSavedTotalTime();


  if (
    savedTime > 0
  ) {

    return savedTime;

  }


  const urlTime =
    getURLTime();


  if (
    urlTime > 0
  ) {

    return urlTime;

  }


  return 0;

}


/* ==================================================
   初期表示
================================================== */

function init() {

  const time =
    getTreatmentTime();


  const timeElement =
    document.getElementById(
      "time"
    );


  timeElement.textContent =
    time + "分";


  /*
   * 取得できた時間を
   * salon_total_time に保存
   */

  if (
    time > 0
  ) {

    localStorage.setItem(
      TOTAL_TIME_KEY,
      String(time)
    );

  }


  /*
   * 予約フォームURL
   *
   * ここは今まで使用していたURLを
   * そのまま使用
   */

  document.getElementById(
    "reserveButton"
  ).href =
    RESERVATION_FORM_URL;

}


/* ==================================================
   閉じる
================================================== */

function closePage() {

  if (
    window.history.length > 1
  ) {

    window.history.back();

    return;

  }


  try {

    window.close();

  } catch (error) {

    console.error(
      "close error",
      error
    );

  }

}


/* ==================================================
   起動
================================================== */

document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>

</body>

</html>
